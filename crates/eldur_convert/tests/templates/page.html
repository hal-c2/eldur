<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Created items</title>
<style>
body {
  margin: 0;
  padding: 24px;
  font-family: sans-serif;
  font-size: 16px;
  color: #1f2430;
  background: #f4f6fa;
}

.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.list {
  width: 400px;
  margin: 0;
  padding: 0;
  list-style: none;
  border: 1px solid #ccd3e0;
  background: #ffffff;
}

.item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid #e3e7ef;
}

.list.compact .item {
  padding: 2px 12px;
}

.item.done {
  background: #f1f3f5;
}

.label {
  flex: 1;
}

.item.done .label {
  color: #868e96;
  text-decoration: line-through;
}

.item:hover .label {
  color: #1c7ed6;
}

.remove {
  padding: 2px 8px;
  border: 1px solid #e3b5b5;
  border-radius: 4px;
  background: #fff5f5;
  color: #b42318;
  font-size: 13px;
}
</style>
</head>
<body>
<div class="toolbar">
  <button type="button" id="add">Add</button>
  <button type="button" id="compact">Compact</button>
</div>
<ul class="list" id="list"></ul>

<script>
  var items = [];
  var next = 1;
  var list = document.getElementById('list');
  var addButton = document.getElementById('add');
  var compactButton = document.getElementById('compact');

  function render() {
    list.textContent = '';
    for (var i = 0; i < items.length; i++) {
      list.appendChild(makeItem(items[i]));
    }
  }

  function makeItem(item) {
    var li = document.createElement('li');
    li.className = 'item' + (item.done ? ' done' : '');

    var box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = item.done;
    box.addEventListener('change', function () {
      item.done = box.checked;
      render();
    });

    var label = document.createElement('span');
    label.className = 'label';
    label.textContent = item.text;
    label.addEventListener('click', function () {
      li.classList.toggle('done');
    });

    var remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'remove';
    remove.textContent = 'Remove';
    remove.addEventListener('click', function () {
      items = items.filter(function (other) { return other !== item; });
      render();
    });

    li.appendChild(box);
    li.appendChild(label);
    li.appendChild(remove);
    return li;
  }

  addButton.addEventListener('click', function () {
    items.push({ text: 'Item ' + next, done: false });
    next += 1;
    render();
  });

  compactButton.addEventListener('click', function () {
    list.classList.toggle('compact');
  });

  document.addEventListener('DOMContentLoaded', function () {
    items = [
      { text: 'First', done: false },
      { text: 'Second', done: true }
    ];
    next = 3;
    render();
  });
</script>
</body>
</html>
