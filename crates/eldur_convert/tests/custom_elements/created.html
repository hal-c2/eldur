<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>created</title></head>
<body>
<div id="host"></div>
<script>
function L(k,v){console.log("LC "+k+" "+v)}
var order=[];
class CountBadge extends HTMLElement {
  static get observedAttributes(){return ["count"]}
  constructor(){super();this.made=true;order.push("ctor")}
  attributeChangedCallback(n,o,v){order.push("attr:"+n+":"+o+":"+v);this.textContent="n="+v}
  connectedCallback(){order.push("connected:"+this.parentNode.id)}
  disconnectedCallback(){order.push("disconnected")}
}
customElements.define("count-badge",CountBadge);
var a=document.createElement("count-badge");
L("created",(a instanceof CountBadge)+":"+a.made+":"+order.join(","));
order=[];
a.setAttribute("count","2");
document.getElementById("host").appendChild(a);
L("appended",order.join(",")+":"+document.getElementById("host").textContent);
order=[];
var b=new CountBadge();
L("constructed",(b instanceof CountBadge)+":"+b.tagName+":"+order.join(","));
order=[];
document.getElementById("host").appendChild(b);
document.getElementById("host").removeChild(a);
L("moved",order.join(",")+":"+document.querySelectorAll("count-badge").length);
order=[];
b.remove();
L("removed",order.join(","));
</script>
</body></html>
