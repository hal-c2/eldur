<!doctype html><html><head><style>body{margin:0;font:16px/20px sans-serif}.row{height:30px;background:#def}#end{height:10px;background:red}
.b{height:30px;padding:0 12px;border:0}.t{height:40px;background:#def}.u{height:50px}</style></head><body><div id="a"></div><div id="a1"></div><div id="a2"></div><div id="b"></div><div id="c"></div><div id="d"></div><div id="end"></div>
<script>function g(id){var r=document.getElementById(id).getBoundingClientRect();return id+":"+[r.left,r.top,r.width,r.height].map(Math.round).join(",")}
function all(){return Array.prototype.map.call(arguments,g).join(" ")}
function add(n,e){document.getElementById(n).appendChild(e);return e}
var e=document.createElement('button');e.id='b0';e.className='b';e.textContent='go';add('a',e);
e=document.createElement('button');e.id='b1';e.textContent='go';add('a1',e);e.className='b';
e=document.createElement('button');e.id='b2';e.textContent='go';e.classList.add('b');add('a2',e);
e=document.createElement('div');e.id='t0';e.className='t';add('b',e);
e=document.createElement('div');e.id='t1';add('b',e);e.className='t';
e=document.createElement('div');e.id='t2';add('b',e);e.classList.add('t');
e=document.createElement('div');e.id='u0';e.className='t';add('c',e);e.className='u';
e=document.createElement('div');e.id='u1';e.className='t';add('d',e);e.classList.add('u');
console.log('LC '+all('b0','b1','b2','t0','t1','t2','u0','u1','end'));</script></body></html>
