<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:16px/20px sans-serif}
#st{display:block}.wrap{position:relative;margin:20px;height:100px}
</style></head><body>
<div class="wrap" id="w"><input id="st" value="a"><button id="bt">b</button><select id="sl"><option>o</option></select><textarea id="ta"></textarea></div><div id="end">e</div>
<script>
function rc(id){var b=document.getElementById(id).getBoundingClientRect();return id+":"+Math.round(b.left)+","+Math.round(b.top)+","+Math.round(b.width)+","+Math.round(b.height)}
function geo(){console.log("CS "+Array.prototype.map.call(arguments,rc).join(" "))}
function cs(id){var s=getComputedStyle(document.getElementById(id)),o=[];for(var i=1;i<arguments.length;i++)o.push(arguments[i]+"="+s[arguments[i]]);console.log("CS "+id+" "+o.join(" "))}
var kinds=["div"];document.createElement(kinds[0]);
function put(id,l,t){var e=document.getElementById(id);e.style.position="absolute";e.style.left=l+"px";e.style.top=t+"px"}
put("st",200,5);put("bt",300,6);put("sl",400,7);put("ta",500,8);
function pos(id){var b=document.getElementById(id).getBoundingClientRect();return id+":"+Math.round(b.left)+","+Math.round(b.top)}
console.log("CS "+["w","st","bt","sl","ta","end"].map(pos).join(" "));cs("st","position","left");cs("bt","position");
</script></body></html>
