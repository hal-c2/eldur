<!doctype html><!-- Made `pre-wrap` paragraphs that wrap at a kept space on a text node's edge: a node of one space between two spans, a space that ends a node before a span, one that starts a node after a span, and a space after a `<br>`, which stays at the start of its line. The same after a `createElement` the analysis cannot follow. -->
<html><head><style>
body{margin:8px;font:13px monospace}
#root{width:200px}
.chat{white-space:pre-wrap}
.chat p{margin:0 0 4px}
.w{color:#c60}
</style></head><body>
<div id="root"></div>
<script>
function dump(pfx){var all=document.querySelectorAll("#root *");for(var i=0;i<all.length;i++){var e=all[i];var q=e.getBoundingClientRect();console.log('CS '+pfx+' '+e.tagName.toLowerCase()+i+' '+[q.x,q.y,q.width,q.height].join(','))}}
var root=document.getElementById('root');
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e}
function para(parts){var p=el('p');parts.forEach(function(x){p.appendChild(typeof x==='string'?document.createTextNode(x):x)});return p}
function w(t){return el('span','w',t)}
var kinds=["div"];document.createElement(kinds[0]);
var chat=el('div','chat');
chat.appendChild(para([w('[aaaaa]'),' ',w('[bbbbb]'),' ',w('[ccccc]'),' ',w('[ddddd]')]));
chat.appendChild(para([w('[aaaaaaaaaa]'),' bbbbbbbbbb ',w('[cccccccccc]')]));
chat.appendChild(para([w('[aaaaaaaaaaaaaaaaaa]'),' bbbbbbbb',w('[c]')]));
chat.appendChild(para([w('[a]'),el('br'),' y',w('[b]')]));
root.appendChild(chat);
setTimeout(function(){dump('H');document.body.appendChild(document.createElement('div')).id='csdone'},100);
</script></body></html>
