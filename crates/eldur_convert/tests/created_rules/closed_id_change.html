<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:16px/20px sans-serif}
#a{color:rgb(255,0,0);padding:4px;background:rgb(255,0,0)}#b{color:rgb(0,128,0);padding:9px;background:rgb(0,128,0)}
</style></head><body data-clicks="#go #off">
<div id="p"></div><div id="end">e</div><button id="go" style="display:block">go</button><button id="off" style="display:block">off</button>
<script>
function rc(id){var b=document.getElementById(id).getBoundingClientRect();return id+":"+Math.round(b.left)+","+Math.round(b.top)+","+Math.round(b.width)+","+Math.round(b.height)}
function geo(){console.log("CS "+Array.prototype.map.call(arguments,rc).join(" "))}
function cs(id){var s=getComputedStyle(document.getElementById(id)),o=[];for(var i=1;i<arguments.length;i++)o.push(arguments[i]+"="+s[arguments[i]]);console.log("CS "+id+" "+o.join(" "))}
var p=document.getElementById("p");
var d=document.createElement("div");d.textContent="hello";d.id="a";p.append(d);
d.dataset.probe="1,1";
geo("p","a","end");cs("a","color","paddingTop");
document.getElementById("go").addEventListener("click",function(){d.id="b";geo("p","b","end");cs("b","color","paddingTop")});
document.getElementById("off").addEventListener("click",function(){d.setAttribute("id","c");geo("p","c","end");cs("c","color","paddingTop")});
</script></body></html>
