body{margin:8px;font:14px Arial}
.d::before{content:"✓ ";color:green}

</style></head><body>
<div id="a">Plain line</div>

<div id="f" class="lh">Own line ✓</div>
<div id="g" class="ser">Serif ✓ text</div>

<script>
setTimeout(()=>{for(const n of ['a','b','c','e','f','g','end']){const q=document.getElementById(n).getBoundingClientRect();console.log('CS '+n+' '+[q.x,q.y,q.width,q.height].join(','))}document.body.appendChild(document.createElement('div')).id='csdone';},100);
</script></body></html>
