<!doctype html><html><head><style>
body{margin:8px;font:14px Arial}
.big{height:40px;background:#eee;width:200px}
.wide{display:inline-block;width:90px;height:12px}
</style></head><body>
<div id="a">static a</div><div id="b">static <span id="bs">span</span> b</div><div id="c">c</div>
<script>
// Classes with names the converter can't see, put on page elements found by a
// query it can't follow: the page's own span becomes a box on its line.
const R=n=>{const q=document.getElementById(n).getBoundingClientRect();console.log('CS '+n+' '+[q.x,q.y,q.width,q.height].join(','))};
const names=['bi','wi'].map(s=>s=='bi'?'big':'wide');
function put(sel,i){document.querySelector(sel).className=names[i]}
put('#a',0);put('#bs',1);
const ids=['a','b','bs','c'];ids.forEach(R);
setTimeout(()=>{ids.forEach(R);document.body.appendChild(document.createElement('div')).id='csdone'},50);
</script></body></html>
