<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:16px/20px sans-serif}
#on{color:rgb(255,0,0);padding:4px}#on b{color:rgb(0,0,255)}
</style></head><body>
<div id="st0"><b id="k">x</b></div>
<script>
function rc(id){var b=document.getElementById(id).getBoundingClientRect();return id+":"+Math.round(b.left)+","+Math.round(b.top)+","+Math.round(b.width)+","+Math.round(b.height)}
function geo(){console.log("CS "+Array.prototype.map.call(arguments,rc).join(" "))}
function cs(id){var s=getComputedStyle(document.getElementById(id)),o=[];for(var i=1;i<arguments.length;i++)o.push(arguments[i]+"="+s[arguments[i]]);console.log("CS "+id+" "+o.join(" "))}
function mk(p,id,cl){var c=document.createElement("div");c.className=cl||"";c.id=id;document.getElementById(p).append(c);return c}
var s=document.getElementById("st0");geo("st0","k");cs("k","color");s.id="on";console.log("CS "+document.getElementById("on").getBoundingClientRect().height);cs("k","color");cs("on","color","paddingTop");
</script></body></html>
