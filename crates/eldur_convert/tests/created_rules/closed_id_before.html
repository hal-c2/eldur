<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:16px/20px sans-serif}
#x{color:rgb(255,0,0);padding:4px;background:rgb(0,0,255)}#y{margin-top:7px;height:30px}
</style></head><body>
<div id="p"></div><div id="end">e</div>
<script>
function rc(id){var b=document.getElementById(id).getBoundingClientRect();return id+":"+Math.round(b.left)+","+Math.round(b.top)+","+Math.round(b.width)+","+Math.round(b.height)}
function geo(){console.log("CS "+Array.prototype.map.call(arguments,rc).join(" "))}
function cs(id){var s=getComputedStyle(document.getElementById(id)),o=[];for(var i=1;i<arguments.length;i++)o.push(arguments[i]+"="+s[arguments[i]]);console.log("CS "+id+" "+o.join(" "))}
var p=document.getElementById("p");
var d=document.createElement("div");d.id="x";d.textContent="hello";p.append(d);
var f=document.createElement("div");f.id="y";p.appendChild(f);
geo("p","x","y","end");cs("x","color","paddingTop","backgroundColor");cs("y","marginTop","height");
</script></body></html>
