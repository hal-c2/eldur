<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:16px/20px sans-serif}
.wrap{position:relative;margin:20px;height:100px}
</style></head><body>
<div class="wrap" id="w"></div><div id="end">e</div>
<script>
function rc(id){var b=document.getElementById(id).getBoundingClientRect();return id+":"+Math.round(b.left)+","+Math.round(b.top)+","+Math.round(b.width)+","+Math.round(b.height)}
function geo(){console.log("CS "+Array.prototype.map.call(arguments,rc).join(" "))}
function cs(id){var s=getComputedStyle(document.getElementById(id)),o=[];for(var i=1;i<arguments.length;i++)o.push(arguments[i]+"="+s[arguments[i]]);console.log("CS "+id+" "+o.join(" "))}
var w=document.getElementById("w");
function mk(tag,id,l,t){var e=document.createElement(tag);e.id=id;w.append(e);e.style.position="absolute";e.style.left=l+"px";e.style.top=t+"px";return e}
mk("input","st",200,5);mk("button","bt",300,6).textContent="b";
var r=document.createElement("button");r.id="fx";r.textContent="r";r.style.position="fixed";r.style.right="5px";r.style.bottom="6px";w.append(r);
function pos(id){var b=document.getElementById(id).getBoundingClientRect();return id+":"+Math.round(b.left)+","+Math.round(b.top)}
console.log("CS "+["w","st","bt","end"].map(pos).join(" "));cs("st","position","left");
var f=document.getElementById("fx").getBoundingClientRect();console.log("CS fx "+Math.round(innerWidth-f.right)+","+Math.round(innerHeight-f.bottom));
</script></body></html>
