<!doctype html><!-- A text node a script takes out of a made `pre-wrap` line, sets while it is out, and puts back keeps its spaces; one moved to a made `normal` line collapses them. -->
<html><head><style>
body{margin:8px;font:13px monospace}
#root{width:330px}
.pre{white-space:pre-wrap;margin-bottom:8px}
.w{color:#c60}
</style></head><body>
<div id="root"></div>
<script>
var kinds=["div"];document.createElement(kinds[0]);
function dump(pfx){var all=document.querySelectorAll("#root *");for(var i=0;i<all.length;i++){var e=all[i];var q=e.getBoundingClientRect();console.log('CS '+pfx+' '+e.tagName.toLowerCase()+i+' '+[q.x,q.y,q.width,q.height].join(','))}}
var root=document.getElementById('root');
var pre=document.createElement('div');pre.className='pre';
var a=document.createElement('span');a.className='w';a.textContent='[a]';pre.appendChild(a);
var t=document.createTextNode(' x y ');pre.appendChild(t);
var s2=document.createElement('span');s2.className='w';s2.textContent='[b]';pre.appendChild(s2);
var u=document.createTextNode('  m  n  ');pre.appendChild(u);
var c=document.createElement('span');c.className='w';c.textContent='[c]';pre.appendChild(c);
root.appendChild(pre);
var norm=document.createElement('div');
var d=document.createElement('span');d.className='w';d.textContent='[d]';norm.appendChild(d);
norm.appendChild(document.createTextNode(' k '));
var s4=document.createElement('span');s4.className='w';s4.textContent='[e]';norm.appendChild(s4);
root.appendChild(norm);
setTimeout(function(){
  pre.removeChild(t);t.textContent='  one    two   ';pre.insertBefore(t,s2);
  pre.removeChild(u);norm.insertBefore(u,s4);
  setTimeout(function(){dump('H');document.body.appendChild(document.createElement('div')).id='csdone'},50);
},50);
</script></body></html>
