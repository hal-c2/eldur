<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:16px/20px sans-serif}
.card{padding:4px}#card-a .t{color:rgb(255,0,0);height:11px}#card-b .t{color:rgb(0,0,255);height:22px}
</style></head><body>
<div id="p"></div>
<script>
function rc(id){var b=document.getElementById(id).getBoundingClientRect();return id+":"+Math.round(b.left)+","+Math.round(b.top)+","+Math.round(b.width)+","+Math.round(b.height)}
function geo(){console.log("CS "+Array.prototype.map.call(arguments,rc).join(" "))}
function cs(id){var s=getComputedStyle(document.getElementById(id)),o=[];for(var i=1;i<arguments.length;i++)o.push(arguments[i]+"="+s[arguments[i]]);console.log("CS "+id+" "+o.join(" "))}
function card(n){var c=document.createElement("div");c.className="card";c.id="card-"+n;var t=document.createElement("div");t.className="t";t.id="t-"+n;c.append(t);document.getElementById("p").append(c)}
card("a");card("b");geo("t-a","t-b");cs("t-a","color");cs("t-b","color");
</script></body></html>
