<!doctype html><!-- Inline content a script makes breaks into lines as the same content written would. -->
<html><head><style>
body{margin:8px;font:15px Arial}
#root{width:280px;line-height:1.5}
.ic{display:inline-block;width:12px;height:12px;background:#36c;vertical-align:middle}
.sup{vertical-align:super;font-size:10px;color:#c00}
.sub{vertical-align:sub;font-size:10px;color:#080}
.bd{display:inline-block;padding:1px 5px;border-radius:8px;background:#eee;font-size:12px;vertical-align:middle}
</style></head><body>
<div id="root"></div>
<script>
function dump(pfx){var all=document.querySelectorAll("#root *");for(var i=0;i<all.length;i++){var e=all[i];var q=e.getBoundingClientRect();console.log('CS '+pfx+' '+e.tagName.toLowerCase()+i+' '+[q.x,q.y,q.width,q.height].join(','))}}
var root=document.getElementById('root');var p=document.createElement('p');
function el(tag,cls,txt){var e=document.createElement(tag);e.className=cls;if(txt)e.textContent=txt;return e}
p.appendChild(el('span','ic'));p.appendChild(document.createTextNode(' Water is H'));p.appendChild(el('span','sub','2'));
p.appendChild(document.createTextNode('O and the area is 4 m'));p.appendChild(el('span','sup','2'));
p.appendChild(document.createTextNode(' for the room, see note '));p.appendChild(el('span','bd','beta'));
p.appendChild(document.createTextNode(' and the icon '));p.appendChild(el('span','ic'));p.appendChild(document.createTextNode(' after wrapping text.'));
root.appendChild(p);
setTimeout(function(){dump('H');document.body.appendChild(document.createElement('div')).id='csdone'},100);
</script></body></html>
