<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:16px/20px sans-serif}
button.pin{position:absolute;left:30px;top:40px}input.pin{position:absolute;right:10px;top:0}.wrap{position:relative;height:100px;margin:15px}
</style></head><body data-clicks="#go">
<div class="wrap" id="w"><button id="b">b</button><input id="i"></div><button id="go" style="display:block">go</button>
<script>
function rc(id){var b=document.getElementById(id).getBoundingClientRect();return id+":"+Math.round(b.left)+","+Math.round(b.top)+","+Math.round(b.width)+","+Math.round(b.height)}
function geo(){console.log("CS "+Array.prototype.map.call(arguments,rc).join(" "))}
function cs(id){var s=getComputedStyle(document.getElementById(id)),o=[];for(var i=1;i<arguments.length;i++)o.push(arguments[i]+"="+s[arguments[i]]);console.log("CS "+id+" "+o.join(" "))}
function pos(id){var b=document.getElementById(id).getBoundingClientRect();return id+":"+Math.round(b.left)+","+Math.round(b.top)}
console.log("CS "+["b"].map(pos).join(" "));
document.getElementById("go").addEventListener("click",function(){document.getElementById("b").classList.add("pin");document.getElementById("i").classList.add("pin");console.log("CS "+pos("b"));console.log("CS "+document.getElementById("i").getBoundingClientRect().right);console.log("CS "+getComputedStyle(document.getElementById("b")).position)});
</script></body></html>
