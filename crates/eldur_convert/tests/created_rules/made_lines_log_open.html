<!doctype html><!-- Inline content a script makes breaks into lines as the same content written would. -->
<html><head><style>
body{margin:8px;font:13px monospace}
#root{width:330px;white-space:pre-wrap;background:#111;color:#ddd;padding:6px}
.w{color:#fc6}
</style></head><body>
<div id="root"></div>
<script>
var kinds=["div"];document.createElement(kinds[0]);
function dump(pfx){var all=document.querySelectorAll("#root *");for(var i=0;i<all.length;i++){var e=all[i];var q=e.getBoundingClientRect();console.log('CS '+pfx+' '+e.tagName.toLowerCase()+i+' '+[q.x,q.y,q.width,q.height].join(','))}}
var pane=document.getElementById('root');
var lines=['[00:01] start   job  42','[00:02] fetching https://example.org/a/very/long/path/that/wraps.txt','[00:03]   indented   line','[00:04] done'];
lines.forEach(function(l,i){var s=document.createElement('span');if(i==1)s.className='w';s.textContent=l+'\n';pane.appendChild(s)});
pane.appendChild(document.createTextNode('tail text   after spans'));
setTimeout(function(){dump('H');document.body.appendChild(document.createElement('div')).id='csdone'},100);
</script></body></html>
