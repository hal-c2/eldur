<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:16px/20px sans-serif}
#host{position:relative;margin:30px 0 0 40px;width:300px;height:200px;padding:10px;border:2px solid black}.pop{position:absolute;left:5px;top:6px;width:20px;height:20px;background:rgb(255,0,0)}#pop2{position:absolute;right:7px;bottom:8px;width:20px;height:10px}
</style></head><body>
<div id="host"></div>
<script>
function rc(id){var b=document.getElementById(id).getBoundingClientRect();return id+":"+Math.round(b.left)+","+Math.round(b.top)+","+Math.round(b.width)+","+Math.round(b.height)}
function geo(){console.log("CS "+Array.prototype.map.call(arguments,rc).join(" "))}
function cs(id){var s=getComputedStyle(document.getElementById(id)),o=[];for(var i=1;i<arguments.length;i++)o.push(arguments[i]+"="+s[arguments[i]]);console.log("CS "+id+" "+o.join(" "))}
var h=document.getElementById("host");
var a=document.createElement("div");a.className="pop";a.id="a";a.dataset.probe="2,2";h.append(a);
var b=document.createElement("div");b.id="pop2";h.append(b);
geo("host","a","pop2");
</script></body></html>
