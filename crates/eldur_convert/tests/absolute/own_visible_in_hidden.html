<!doctype html><html><head><style>body{margin:0;font:16px/20px sans-serif}p{margin:0}#go{display:block;width:50px;height:30px;padding:0;border:0}.x{height:10px}.pop{display:none;position:absolute;top:50px;left:60px;width:100px;height:40px;background:red}.pop.open{display:block}</style></head><body><button id="go">go</button><div id="host"><div class="x"></div><div id="m" class="pop"></div></div><script>
var host=document.getElementById('host');var m=document.getElementById('m');
m.classList.add('open');host.style.display='none';console.log('LC start');
document.getElementById('go').addEventListener('click',function(){host.style.display='block';m.classList.remove('open');m.classList.add('open')});
</script></body></html>
