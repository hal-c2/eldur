<!doctype html><html><head><meta charset="utf-8"><script>
function L(){console.log("LC "+[].slice.call(arguments).join(" "))}
function R(e){var r=e.getBoundingClientRect();return {l:Math.round(r.left),t:Math.round(r.top),r:Math.round(r.right),b:Math.round(r.bottom),w:Math.round(r.width),h:Math.round(r.height)}}
function near(a,b){return Math.abs(a-b)<=3}
document.addEventListener("DOMContentLoaded",function(){
var byId=function(s){return document.getElementById(s)};
var one=R(byId("bn")).h;
// A button that draws its line breaks is as tall as the lines it draws.
L("pre-lines",R(byId("p")).h>one+10,near(R(byId("p")).h,R(byId("pl")).h));
L("pre-line-lines",R(byId("pl")).h>one+10);
// A fixed-width button whose spaces may break wraps its label there.
L("fixed-pre-wrap",R(byId("fw")).h>one+10,near(R(byId("fn")).h,one));
// A button that takes an element keeps its white-space: pre keeps its
// spaces, nowrap stays on one line.
var ps=byId("ps"),pc=document.createElement("span");pc.textContent="C";ps.append(pc);
L("pre-element",near(R(ps).w,R(byId("pr")).w),JSON.stringify(ps.textContent));
// Its rendered text keeps the spaces it draws, with an empty element on
// the line too.
ps.append(document.createElement("span"));
L("pre-element-text",JSON.stringify(ps.innerText));
// pre-line keeps line breaks but collapses runs of spaces, also once the
// button holds an element.
var lx=byId("lx"),lc=document.createElement("span");lc.textContent="C";lx.append(lc);
L("pre-line-element",near(R(lx).w,R(byId("lr")).w),JSON.stringify(lx.textContent));
var nr=byId("nr"),nc=document.createElement("span");nc.textContent=" Ccc";nr.append(nc);
L("nowrap-element",near(R(nr).h,one));
// A button the page gives breaks and an inline-block is as tall as its
// lines.
L("pre-line-markup",near(R(byId("bm")).h,R(byId("pl")).h),R(byId("bm")).h>one+10);
// So is one whose element is inline, the label it is folded into.
L("pre-line-bold",near(R(byId("bmp")).h,R(byId("pl")).h),R(byId("bmp")).h>one+10);
// A script that changes the button's white-space later changes how its
// line keeps spaces, and what it holds stays as it is.
var sw=byId("sw"),sc=document.createElement("span");sc.textContent="C";sw.append(sc);
sw.style.whiteSpace="pre";var swPre=R(sw).w;
sw.style.whiteSpace="pre-line";var swLine=R(sw).w;
sw.style.whiteSpace="normal";
L("white-space-later",near(swPre,R(byId("sr")).w),near(swLine,R(byId("lr")).w),near(R(sw).w,R(byId("lr")).w),JSON.stringify(sw.textContent));
// A `>` inside a quoted attribute value is the attribute's, not the tag's end.
var q=byId("q");q.innerHTML='<span title="a>b">Save</span>';
L("quoted-gt",JSON.stringify(q.textContent),q.firstChild.title,q.childNodes.length);
q.innerHTML="<span title=it's>Go</span>";
L("unquoted-apos",JSON.stringify(q.textContent),q.firstChild.title);
// A value not quoted runs to a space or `>`: an `=` and a quote in it are
// its own, not a quoted value opening.
q.innerHTML='<span data-x=a=">OK</span>';
L("unquoted-eq-quote",JSON.stringify(q.textContent),q.firstChild.getAttribute("data-x"),q.childNodes.length);
// A tag cut short before its `>`, with many quoted attributes, is read in
// time proportional to its length, and is no node.
var t0=Date.now();byId("cut").insertAdjacentHTML("beforeend","<span"+' a="x"'.repeat(30));
L("unclosed-fast",Date.now()-t0<500,JSON.stringify(byId("cut").textContent),byId("cut").childNodes.length);
// A quoted value never closed runs to the end of the input, past later
// tags, also inside an element: all of it is dropped.
var u=byId("open");u.innerHTML='<span a="x>Go</span><b>Y</b>';
L("unclosed-value",JSON.stringify(u.textContent),u.childNodes.length);
u.innerHTML='Z<b><span a="x>Go</span></b><i>Y</i>';
L("unclosed-nested",JSON.stringify(u.textContent),u.childNodes.length,u.lastChild.nodeName);
// A `<` inside a tag is part of that tag, and a run of start tags with no
// `>` is dropped from the first: either is read in time linear in its length.
var w=byId("many");t0=Date.now();w.innerHTML="L"+'<a"x '.repeat(16000)+">";
L("many-lt-fast",Date.now()-t0<500,w.textContent.charAt(0));
t0=Date.now();w.innerHTML="L"+"<a x".repeat(16000);
L("many-runoff-fast",Date.now()-t0<500,JSON.stringify(w.textContent),w.childNodes.length);
t0=Date.now();w.insertAdjacentHTML("beforeend","<p".repeat(16000)+">");
L("many-p-fast",Date.now()-t0<500,w.textContent.charAt(0));
// Start tags never closed nest, each holding the rest, but only so deep:
// past that an element is its parent's sibling, a text is still the
// innermost element's. So the `Y` after the last `span` closes is in the
// one before it, ahead of the `Z`.
function deepest(e){var d=0;while(e.lastElementChild){e=e.lastElementChild;++d;}return d;}
var dp=byId("deep");
dp.innerHTML='<span>'.repeat(600)+"Z";
L("many-open",JSON.stringify(dp.textContent),deepest(dp),dp.getElementsByTagName("span").length);
dp.innerHTML='<span>'.repeat(600)+"Z<b>Y</b>";
L("many-open-closed",JSON.stringify(dp.textContent),deepest(dp));
dp.innerHTML='<span>'.repeat(600)+"Z</span>Y";
L("many-open-close-last",JSON.stringify(dp.textContent));
// What an element holds before a start tag the input ends inside is still
// markup: the `i` inside the unclosed `b` is an element.
var k=byId("kept");k.insertAdjacentHTML("beforeend",'<b><i>OK</i><span title="unfinished</b>');
L("unclosed-holder",k.childNodes.length,k.lastChild.nodeName,k.lastChild.childNodes.length,k.lastChild.firstChild.nodeName,JSON.stringify(k.textContent));
k.innerHTML='<b><i>OK</i><span title="unfinished</b>';
L("unclosed-holder-inner",k.childNodes.length,k.lastChild.nodeName,k.lastChild.childNodes.length,k.lastChild.firstChild.nodeName,JSON.stringify(k.textContent));
// A run of `<` inside a quoted value is read once, not once per `<`.
t0=Date.now();q.innerHTML='<b><span title="'+'<a'.repeat(16000)+'">x</span></b>';
L("many-lt-in-value-fast",Date.now()-t0<500,JSON.stringify(q.textContent),q.firstChild.firstChild.title.length);
// An end tag written in a quoted value closes nothing.
q.innerHTML='<b><span title="<b>">OK</span></b>tail';
L("title-holds-tag",JSON.stringify(q.textContent),q.childNodes.length,q.lastChild.nodeName);
// A bare value takes a `/` before the `>`: that tag is not self-closing, and
// holds what follows up to its end tag.
q.innerHTML='<b>outer<b data-x=a/>inner</b>tail</b>';
L("unquoted-slash",JSON.stringify(q.textContent),q.childNodes.length,q.firstChild.childNodes.length,q.firstChild.childNodes[1].getAttribute("data-x"),JSON.stringify(q.firstChild.childNodes[1].textContent));
// Characters of the private use area are text like any other, also the
// ones a reading of rendered text could mark its own spaces with.
function codes(t){return Array.prototype.map.call(t,function(c){return c.charCodeAt(0).toString(16);}).join(",");}
var pua="A\uE011B\uE000C\uE012\uE013\uE010D";
byId("pd").textContent=pua;byId("pb").textContent=pua;
L("private-use",codes(byId("pd").innerText),codes(byId("pb").innerText));
});
</script></head><body style="margin:0;font:16px/20px sans-serif">
