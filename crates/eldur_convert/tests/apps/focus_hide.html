<!doctype html>
<html>
<head><meta charset="utf-8"><title>Focus on what stops being rendered</title>
<style>.gone { display: none; } .ghost { visibility: hidden; }</style></head>
<body>
<div id="w1"><input id="own"></div>
<div id="w2"><input id="anc"></div>
<div id="w3"><input id="cls"></div>
<div id="w4"><input id="vis"></div>
<div id="w5"><input id="attr"></div>
<div id="w6"><input id="quiet"></div>
<button type="button" id="show">show</button>
<script>
function log(s) { console.log(s); }
const act = () => document.activeElement && document.activeElement.id || document.activeElement.tagName;
['own', 'anc', 'cls', 'vis', 'attr', 'quiet'].forEach((id) => {
  const e = document.getElementById(id);
  e.addEventListener('focus', () => log('focus ' + id));
  e.addEventListener('blur', () => log('blur ' + id));
  e.addEventListener('focusout', () => log('focusout ' + id));
});
function hider(id, fn) {
  document.getElementById(id).addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter') return;
    fn();
    log('sync ' + id + ' active=' + act());
    setTimeout(() => log('later ' + id + ' active=' + act()), 20);
  });
}
hider('own', () => { document.getElementById('own').style.display = 'none'; });
hider('anc', () => { document.getElementById('w2').style.display = 'none'; });
hider('cls', () => { document.getElementById('w3').classList.add('gone'); });
hider('vis', () => { document.getElementById('w4').classList.add('ghost'); });
hider('attr', () => { document.getElementById('w5').hidden = true; });
// Nothing here reads activeElement while it is hidden.
document.getElementById('quiet').addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter') return;
  const w = document.getElementById('w6');
  w.style.display = 'none';
  setTimeout(() => { w.style.display = 'block'; }, 30);
});
document.getElementById('show').addEventListener('click', () => {
  document.getElementById('own').style.display = '';
  document.getElementById('w2').style.display = '';
  document.getElementById('w3').classList.remove('gone');
  document.getElementById('w4').classList.remove('ghost');
  document.getElementById('w5').hidden = false;
  document.getElementById('show').blur();
  log('shown active=' + act());
});
</script>
</body>
</html>
