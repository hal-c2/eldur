const name=n=>n.id||n.tagName;
for(const t of ["focus","blur"]){
 document.addEventListener(t,e=>console.log(t+":"+name(e.target)),true);
}
document.getElementById("ps").addEventListener("mousedown",e=>e.preventDefault());
