<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account settings</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #222; background: #f5f6f8; }
.page { max-width: 640px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
h1 { font-size: 20px; margin: 0; padding: 20px 24px 0; }
.tabs { display: flex; gap: 4px; padding: 16px 24px 0; border-bottom: 1px solid #ddd; }
.tab { padding: 8px 16px; background: none; border: none; border-bottom: 2px solid transparent; font-size: 14px; color: #555; cursor: pointer; }
.tab:hover { color: #000; }
.tab.active { color: #1a56db; border-bottom-color: #1a56db; font-weight: bold; }
.panel { display: none; padding: 24px; line-height: 1.5; }
.panel.active { display: block; }
.panel h2 { margin: 0 0 8px; font-size: 16px; }
.panel p { margin: 0 0 12px; }
</style>
</head>
<body>
<div class="page">
  <h1>Account settings</h1>
  <div class="tabs" role="tablist">
    <button class="tab active" id="tab-profile" data-panel="profile" role="tab" aria-selected="true">Profile</button>
    <button class="tab" id="tab-billing" data-panel="billing" role="tab" aria-selected="false">Billing</button>
    <button class="tab" id="tab-alerts" data-panel="alerts" role="tab" aria-selected="false">Alerts</button>
  </div>
  <section class="panel active" id="profile">
    <h2>Profile</h2>
    <p>Your name and photo are shown to people you work with.</p>
    <p>Change them whenever you like.</p>
  </section>
  <section class="panel" id="billing">
    <h2>Billing</h2>
    <p>You are on the free plan.</p>
  </section>
  <section class="panel" id="alerts">
    <h2>Alerts</h2>
    <p>We send a weekly summary by email.</p>
    <p>You can turn it off here.</p>
    <p>Security alerts are always on.</p>
  </section>
</div>
<script>
const tabs = document.querySelectorAll('.tab');
const panels = document.querySelectorAll('.panel');
function show(id) {
  tabs.forEach(t => {
    const on = t.dataset.panel === id;
    t.classList.toggle('active', on);
    t.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  panels.forEach(p => p.classList.toggle('active', p.id === id));
  console.log('showing ' + id);
}
tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.panel)));
</script>
</body>
</html>
