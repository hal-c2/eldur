<!doctype html>
<html><head><meta charset="utf-8"><title>Lines that follow the viewport</title>
<style>
  body { margin: 8px; font: 16px sans-serif; }
  p { margin: 0 0 8px; }
  .chip { display: inline-block; width: 60px; height: 20px; background: #cde; }
</style></head><body>
<p id="flow">Some words <button id="a">one</button> more words <span id="c" class="chip"></span> and a few more words to fill the line up <input id="i"> tail of it <button id="b">two</button></p>
<p id="pct" style="line-height: 20px">x<span id="vp" class="chip" style="vertical-align: 50%"></span>x<span id="vn" class="chip" style="vertical-align: -25%"></span>x</p>
<p id="end"><button id="grow">grow</button></p>
<script>
  document.getElementById("grow").onclick = function () {
    document.getElementById("c").style.width = "200px";
  };
</script>
</body></html>
