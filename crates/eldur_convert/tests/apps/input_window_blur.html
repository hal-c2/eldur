<!DOCTYPE html>
<html>
<head><style>
body { margin: 8px; font: 16px sans-serif; }
button { margin: 4px; }
</style></head>
<body>
<button id="w">w</button>
<button id="x">x</button>
<button id="y">y</button>
<button id="z">z</button>
<button id="x2">x2</button>
<button id="y2">y2</button>
<button id="z2">z2</button>
<button id="v2">v2</button>
<button id="x3">x3</button>
<button id="y3">y3</button>
<button id="z3">z3</button>
<button id="x4">x4</button>
<button id="y4">y4</button>
<button id="z4">z4</button>
<button id="x5">x5</button>
<button id="y5">y5</button>
<button id="z5">z5</button>
<button id="x6">x6</button>
<button id="y6">y6</button>
<button id="z6">z6</button>
<button id="w6">w6</button>
<button id="x7">x7</button>
<button id="w7">w7</button>
<p>words <a href="#" id="l">l</a> more</p>
<p tabindex="0" id="p7">held <a href="#" id="m7">m7</a></p>
<div id="gap">gap</div>
<button id="x9">x9</button>
<button id="w9">w9</button>
<button id="k10">k10</button>
<p tabindex="0" id="p9">two <a href="#" id="c9">c9</a> <a href="#" id="d9">d9</a></p>
<button id="r8">r8</button>
<script>
// The window loses focus and gets it back, by itself and right after a blur
// listener moved the focus. `document.hasFocus()` follows the window.
function id(el) { return el && el.id ? el.id : el ? el.nodeName : "-"; }
function on(id_) { return document.getElementById(id_); }
["focus", "blur", "focusin", "focusout"].forEach(function (type) {
  document.addEventListener(type, function (ev) {
    console.log(type, id(ev.target), "from", id(ev.relatedTarget), "active", id(document.activeElement),
      "has", document.hasFocus());
  }, true);
});
// The window itself hears its blur and focus, through a listener and its
// handler property; `visibilitychange` would say if the page were hidden.
// They are set from the first click, after the recording's own focus moves
// at load.
function heard(what) {
  return function (ev) {
    console.log(what, ev.type, "at window", ev.target === window, "active", id(document.activeElement),
      "has", document.hasFocus());
  };
}
on("w").addEventListener("click", function () {
  window.addEventListener("blur", heard("listener"));
  window.addEventListener("focus", heard("listener"));
  window.onblur = heard("handler");
  window.onfocus = heard("handler");
  document.addEventListener("visibilitychange", function () { console.log("visibilitychange", document.visibilityState); });
}, { once: true });
document.addEventListener("click", function (ev) {
  console.log("click", id(ev.target), "has", document.hasFocus());
});
// Pressing y hides x from its mousedown, and x's blur listener focuses z: the
// window then goes away in the same turn.
on("x").addEventListener("click", function () {
  on("x").addEventListener("blur", function () { on("z").focus(); }, { once: true });
  on("y").addEventListener("mousedown", function () { on("x").style.visibility = "hidden"; }, { once: true });
});
// The same, and a Tab in the same turn as the press: it goes on from z2.
on("x2").addEventListener("click", function () {
  on("x2").addEventListener("blur", function () { on("z2").focus(); }, { once: true });
  on("y2").addEventListener("mousedown", function () { on("x2").style.visibility = "hidden"; }, { once: true });
});
// The same, and a move back to the element the press went to, in the same
// turn: Shift+Tab from z3 to y3, and a second press on y4.
["3", "4"].forEach(function (n) {
  on("x" + n).addEventListener("click", function () {
    on("x" + n).addEventListener("blur", function () { on("z" + n).focus(); }, { once: true });
    on("y" + n).addEventListener("mousedown", function () { on("x" + n).style.visibility = "hidden"; }, { once: true });
  });
});
// Pressing y5 moves the focus from x5, whose blur listener focuses z5. A
// press back on x5, still shown, comes in the same turn.
on("x5").addEventListener("click", function () {
  on("x5").addEventListener("blur", function () { on("z5").focus(); }, { once: true });
}, { once: true });
// Pressing y6 moves the focus from x6, whose blur listener focuses z6. A
// press on w6 in the same turn focuses z6 again and then y6, and keeps its own.
on("x6").addEventListener("click", function () {
  on("x6").addEventListener("blur", function () { on("z6").focus(); }, { once: true });
  on("w6").addEventListener("mousedown", function (ev) {
    ev.preventDefault(); on("z6").focus(); on("y6").focus();
  }, { once: true });
}, { once: true });
// Pressing the paragraph p7 moves the focus from x7, whose blur listener
// focuses the link m7 in it. A press on w7 in the same turn focuses p7.
on("x7").addEventListener("click", function () {
  on("x7").addEventListener("blur", function () { on("m7").focus(); }, { once: true });
  on("w7").addEventListener("mousedown", function (ev) { ev.preventDefault(); on("p7").focus(); }, { once: true });
}, { once: true });
// Pressing p9 moves the focus from x9, whose blur listener focuses the link
// c9 in it. A press on w9 in the same turn focuses its other link, d9.
on("x9").addEventListener("click", function () {
  on("x9").addEventListener("blur", function () { on("c9").focus(); }, { once: true });
  on("w9").addEventListener("mousedown", function (ev) { ev.preventDefault(); on("d9").focus(); }, { once: true });
}, { once: true });
// k10's click queues a promise; a key in the same turn hears it settled.
var ready = false;
on("k10").addEventListener("click", function () {
  Promise.resolve().then(function () { ready = true; console.log("k10 microtask"); });
  document.addEventListener("keydown", function (ev) { console.log("keydown", ev.key, "ready", ready); }, { once: true });
}, { once: true });
// The window's focus listener takes r8 out as the window comes back to it.
on("r8").addEventListener("click", function () {
  window.addEventListener("focus", function () { on("r8").remove(); }, { once: true });
}, { once: true });
// A link in a line keeps the focus while its window is away.
on("l").addEventListener("click", function (ev) { ev.preventDefault(); });
</script>
</body>
</html>
