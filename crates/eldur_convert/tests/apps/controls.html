<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Controls with no author style</title>
<style>
body { margin: 8px; font: 20px serif; color: #800; }
.note { color: #080; font-size: 12px; }
</style></head>
<body>
<div><button id="b">Go now</button></div>
<div><input id="t"></div>
<div><input id="email" type="email"></div>
<div><input id="pass" type="password"></div>
<div><input id="url" type="url"></div>
<div><input id="tel" type="tel"></div>
<div><input id="search" type="search"></div>
<div><input id="num" type="number" value="4"></div>
<div><input id="range" type="range"></div>
<div><input id="check" type="checkbox"></div>
<div><input id="radio" type="radio"></div>
<div><input id="sub" type="submit"></div>
<div><input id="res" type="reset"></div>
<div><input id="but" type="button" value="Press"></div>
<div><input id="mono" style="font-family: monospace"></div>
<div><input id="small" size="10"></div>
<div><textarea id="area"></textarea></div>
<div><textarea id="area4" rows="4" cols="10"></textarea></div>
<div><select id="sel"><option>Short</option><option>A much longer option</option></select></div>
<div><input id="bare" style="border: 0; padding: 0; background: none"></div>
<div><input id="thin" style="border: 1px solid #999"></div>
<div><button id="flat" style="border: 0">Flat</button></div>
<div><button id="pad" style="padding: 8px 18px; font-size: 14px">Pad</button></div>
<p class="note" id="end">end</p>
</body>
</html>
