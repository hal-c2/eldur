<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modal</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; font-size: 16px; }
main { padding: 40px; }
.btn { padding: 8px 16px; border: 1px solid #1a56db; background: #1a56db; color: white; border-radius: 4px; font-size: 14px; cursor: pointer; }
.btn.secondary { background: white; color: #1a56db; }
.overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; }
.overlay.open { display: flex; }
.dialog { background: #fff; width: 400px; padding: 24px; border-radius: 8px; }
.dialog h2 { margin: 0 0 12px; font-size: 18px; }
.dialog label { display: block; margin-bottom: 4px; font-size: 14px; }
.dialog input { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 16px; border: 1px solid #aaa; }
.actions { display: flex; justify-content: flex-end; gap: 8px; }
#result { margin-top: 16px; color: #0a6; }
</style>
</head>
<body>
<main>
  <h1>Team</h1>
  <button class="btn" id="open">Invite someone</button>
  <p id="result"></p>
</main>
<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="title">
    <h2 id="title">Invite someone</h2>
    <label for="email">Email</label>
    <input id="email" type="text">
    <div class="actions">
      <button class="btn secondary" id="cancel">Cancel</button>
      <button class="btn" id="send">Send invite</button>
    </div>
  </div>
</div>
<script>
const overlay = document.getElementById('overlay');
const email = document.getElementById('email');
const opener = document.getElementById('open');
function openDialog() {
  overlay.classList.add('open');
  email.value = '';
  email.focus();
  console.log('opened');
}
function closeDialog() {
  overlay.classList.remove('open');
  opener.focus();
  console.log('closed');
}
opener.addEventListener('click', openDialog);
document.getElementById('cancel').addEventListener('click', closeDialog);
document.getElementById('send').addEventListener('click', () => {
  document.getElementById('result').textContent = 'Invited ' + email.value;
  closeDialog();
});
overlay.addEventListener('click', e => { if (e.target === overlay) closeDialog(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay.classList.contains('open')) closeDialog();
});
</script>
</body>
</html>
