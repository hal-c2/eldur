<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bubble</title>
<style>
html, body { margin: 0; padding: 0; }
input, button { display: block; margin: 8px; width: 160px; height: 28px; }
</style>
</head>
<body>
<form id="f">
  <input id="fine" value="x">
  <input id="need" required>
  <input id="also" required>
  <button id="go">Go</button>
</form>
<script>
["click","invalid","focusin","submit"].forEach(function (t) {
  document.addEventListener(t, function (e) {
    console.log([t, e.target.id, document.activeElement.id].join(" "));
  }, true);
});
</script>
</body>
</html>
