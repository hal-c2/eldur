<!doctype html>
<html><head><meta charset="utf-8"><title>A justified line with boxes</title>
<style>
  body { margin: 8px; font: 16px sans-serif; }
  .chip { display: inline-block; width: 60px; height: 20px; background: #cde; }
</style></head><body>
<p id="just" style="text-align: justify; width: 320px">Justified words run along <button id="ja">box</button> this line and carry on over <span id="jc" class="chip"></span> the next line too until it ends</p>
</body></html>
