<!DOCTYPE html>
<html>
<head><style>
#box { width: 120px; height: 60px; background: #336699; opacity: 1; transition: opacity 0.1s linear 1s; }
#box.off { opacity: 0.25; }
</style></head>
<body>
<button id="go" onclick="document.getElementById('box').classList.toggle('off')">go</button>
<div id="box"></div>
</body>
</html>
