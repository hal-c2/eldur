<!doctype html><html><head><style>
body{font:16px/20px sans-serif}
.m{height:20px;margin:12px 0 30px;background:#def}
.big{height:20px;margin:40px 0 5px;background:#fed}
#top{margin-top:25px}
#pad{padding:7px;background:#eee;margin:3px 0}
#border{border:1px solid #000}
#row{display:flex;background:#ddd}
#clip{overflow:hidden;background:#ccc}
#auto{margin:9px 0}
#fixed{height:60px;background:#bbb;margin-bottom:6px}
.st{height:10px;background:#333;margin:15px 0}
.wrap{margin:20px 0}
.in{height:10px;margin:33px 0 44px;background:#a00}
.side{width:30px;height:10px;margin:4px 6px;background:#0a0}
.empty{margin:11px 0 13px}
</style></head><body>
<div id="top"></div>
<div class="st" id="s0"></div>
<div id="auto"></div>
<div class="st" id="s1"></div>
<div id="pad"></div>
<div id="border"></div>
<div id="row"></div>
<div id="clip"></div>
<div id="fixed"></div>
<div class="st" id="s2"></div>
<div id="nest"></div>
<div class="st" id="s3"></div>
<div id="empties"></div>
<div class="st" id="s4"></div>
<script>
var t1=document.createElement('div');t1.className='m';t1.id='t1';document.getElementById('top').appendChild(t1);
var a1=document.createElement('div');a1.className='big';a1.id='a1';document.getElementById('auto').appendChild(a1);
var a2=document.createElement('div');a2.className='m';a2.id='a2';document.getElementById('auto').appendChild(a2);
var p1=document.createElement('div');p1.className='m';p1.id='p1';document.getElementById('pad').appendChild(p1);
var p2=document.createElement('div');p2.className='m';p2.id='p2';document.getElementById('pad').appendChild(p2);
var b1=document.createElement('div');b1.className='m';b1.id='b1';document.getElementById('border').appendChild(b1);
var r1=document.createElement('div');r1.className='side';r1.id='r1';document.getElementById('row').appendChild(r1);
var r2=document.createElement('div');r2.className='side';r2.id='r2';document.getElementById('row').appendChild(r2);
var c1=document.createElement('div');c1.className='m';c1.id='c1';document.getElementById('clip').appendChild(c1);
var f1=document.createElement('div');f1.className='m';f1.id='f1';document.getElementById('fixed').appendChild(f1);
var e1=document.createElement('div');e1.className='empty';e1.id='e1';document.getElementById('empties').appendChild(e1);
var e2=document.createElement('div');e2.className='m';e2.id='e2';document.getElementById('empties').appendChild(e2);
var e3=document.createElement('div');e3.className='empty';e3.id='e3';document.getElementById('empties').appendChild(e3);
var w1=document.createElement('div');w1.className='wrap';w1.id='w1';document.getElementById('nest').appendChild(w1);
var i1=document.createElement('div');i1.className='in';i1.id='i1';w1.appendChild(i1);
function r(id){var b=document.getElementById(id).getBoundingClientRect();return id+'='+Math.round(b.left)+','+Math.round(b.top)+'+'+Math.round(b.height)}
var ids=['top','t1','s0','auto','a1','a2','s1','pad','p1','p2','border','b1','row','r1','r2','clip','c1','fixed','f1','s2','nest','w1','i1','s3','empties','e1','e2','s4'];
for(var k=0;k<ids.length;k+=6)console.log('CS '+ids.slice(k,k+6).map(r).join(' '));
</script></body></html>
