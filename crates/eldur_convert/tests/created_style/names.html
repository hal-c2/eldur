<!doctype html><html><head><style>body{margin:0;font:16px/20px sans-serif}.card{height:40px;background:#def;margin-bottom:4px}.big{height:60px;background:#fed}#named{height:25px;background:rgb(1,2,3)}.a.b{height:33px}.late{height:15px}.swap{height:11px}#end{height:10px}</style></head><body><div id="list"></div><div id="end"></div>
<script>
function box(id){var b=document.getElementById(id).getBoundingClientRect();return id+" "+Math.round(b.left)+","+Math.round(b.top)+" "+Math.round(b.width)+"x"+Math.round(b.height)}
function geo(){console.log("CS "+Array.prototype.map.call(arguments,box).join(" | "))}
function cs(id){var s=getComputedStyle(document.getElementById(id)),o=[];for(var i=1;i<arguments.length;i++)o.push(arguments[i]+"="+s[arguments[i]]);console.log("CS "+id+" "+o.join(" "))}
var tags=["div","section"];var l=document.getElementById("list");
function mk(tag,cls){var e=document.createElement(tag);e.className=cls;return e}
var a=mk(tags[0],"card");a.id="a";l.appendChild(a);
var b=document.createElement(tags[1]);b.classList.add("big");b.id="b";l.appendChild(b);
var c=document.createElement("div");c.setAttribute("class","a b");c.setAttribute("id","c");l.appendChild(c);
var d=document.createElement("div");d.id="named";l.appendChild(d);
var e=document.createElement("div");e.id="e";l.appendChild(e);e.className="late";
var f=document.createElement("div");f.id="f";f.className="card";l.appendChild(f);geo("f");f.className="swap";
var g=document.createElement("div");g.id="g";g.classList.add("card");l.appendChild(g);g.classList.remove("card");g.classList.toggle("big");
geo("a","b","c","named","e","f","g","end");cs("a","backgroundColor","height","marginBottom");cs("named","backgroundColor");cs("g","backgroundColor");console.log("CS q "+document.querySelectorAll(".big").length+" "+document.querySelectorAll("section.big").length)
</script></body></html>
