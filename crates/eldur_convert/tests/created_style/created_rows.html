<!doctype html><html><head><style>body{margin:0;font:14px/1.4 sans-serif}
table{border-collapse:collapse;width:300px}th,td{border:1px solid #ddd;padding:6px 10px;text-align:left}td.num{text-align:right}
</style></head><body>
<table id="t"><thead><tr><th id="h">Name</th><th id="h2">Age</th></tr></thead><tbody id="rows"></tbody></table>
<p id="after" style="margin:0">after</p>
<script>
var q=function(s){return document.getElementById(s)};
function row(i){var tr=document.createElement("tr");tr.id="r"+i;
 var a=document.createElement("td");a.id="a"+i;a.textContent="name";tr.appendChild(a);
 var b=document.createElement("td");b.id="b"+i;b.textContent="36";b.className="num";tr.appendChild(b);return tr}
for(var i=0;i<4;i++)q("rows").appendChild(row(i));
console.log("CS after "+Math.round(q("after").getBoundingClientRect().top));
console.log("CS align "+getComputedStyle(q("b0")).textAlign);
</script></body></html>
