<!doctype html><html><head><style>:root{--c:rgb(9,8,7);--h:21px}body{margin:0;font:16px/20px sans-serif}.v{color:var(--c);height:var(--h);background:var(--nope,rgb(1,2,3));padding:var(--p,2px 3px)}.scope{--c:rgb(100,0,0);--h:5px}.sh{--bd:2px solid rgb(0,0,255);border:var(--bd);margin:var(--m,1px) 0}.par{height:8px;.kid{height:9px}&.me{height:10px}>.ch{height:12px}}@layer base,theme;@layer theme{.l{height:30px;color:rgb(0,1,0)}.imp{height:1px!important}}@layer base{.l{height:40px;color:rgb(0,2,0)}.imp{height:2px!important}}.unl{height:3px}@layer base{.unl.unl.unl{height:50px}}:is(#x,.is) .w, .w{height:6px}.w.w2{height:7px}:where(#list) .wh{height:4px}.wh{height:14px}#list :is(.q,#none){height:16px}.q.q.q{height:18px}@media (min-width:600px){.m{height:23px}}@media (max-width:500px){.m{height:24px}.m2{height:25px}}@media print{.m{height:26px}}.m2{height:27px}.imp{height:60px}#end{height:10px}</style></head><body><div id="list"></div><div id="end"></div>
<script>
function box(id){var b=document.getElementById(id).getBoundingClientRect();return id+" "+Math.round(b.left)+","+Math.round(b.top)+" "+Math.round(b.width)+"x"+Math.round(b.height)}
function geo(){console.log("CS "+Array.prototype.map.call(arguments,box).join(" | "))}
function cs(id){var s=getComputedStyle(document.getElementById(id)),o=[];for(var i=1;i<arguments.length;i++)o.push(arguments[i]+"="+s[arguments[i]]);console.log("CS "+id+" "+o.join(" "))}
var l=document.getElementById("list");function mk(p,c,id){var e=document.createElement("div");if(c)e.className=c;if(id)e.id=id;p.appendChild(e);return e}
mk(l,"v","v1");var sc=mk(l,"scope","sc");mk(sc,"v","v2");mk(l,"sh","sh");var pa=mk(l,"par","pa");mk(pa,"kid","pk");mk(pa,"ch","pc");mk(l,"par me","pm");mk(l,"kid","nk");mk(l,"l","la");mk(l,"imp","im");mk(l,"unl","un");mk(l,"w w2","w");mk(l,"wh","wh");mk(l,"q","q");mk(l,"m","m");mk(l,"m2","m2");
geo("v1","v2","sh","pa","pk","pc","pm","nk","la","im","un","w","wh","q","m","m2","end");
cs("v1","color","height","backgroundColor","paddingTop","paddingLeft");cs("v2","color","height");cs("sh","borderTopWidth","borderTopColor","marginTop","marginLeft");cs("la","color","height")
</script></body></html>
