<!doctype html><html><head><style>body{margin:0;font:16px/20px sans-serif}.rel{position:relative;left:5px;top:7px;height:20px;background:#eee}.host{position:relative;height:100px;width:400px;padding:10px}.abs{position:absolute;left:30px;top:15px;width:50px;height:25px;background:red}.br{position:absolute;right:10px;bottom:5px;width:20px;height:20px}.fix{position:fixed;left:3px;top:4px;width:6px;height:8px}.pg{position:absolute;left:100px;top:200px;width:10px;height:10px}#end{height:10px}.z{z-index:5}</style></head><body><div id="list"></div><div id="end"></div>
<script>
function box(id){var b=document.getElementById(id).getBoundingClientRect();return id+" "+Math.round(b.left)+","+Math.round(b.top)+" "+Math.round(b.width)+"x"+Math.round(b.height)}
function geo(){console.log("CS "+Array.prototype.map.call(arguments,box).join(" | "))}
function cs(id){var s=getComputedStyle(document.getElementById(id)),o=[];for(var i=1;i<arguments.length;i++)o.push(arguments[i]+"="+s[arguments[i]]);console.log("CS "+id+" "+o.join(" "))}
var l=document.getElementById("list");function mk(p,c,id){var e=document.createElement("div");if(c)e.className=c;if(id)e.id=id;p.appendChild(e);return e}
var r=mk(l,"rel","r");var h=mk(l,"host","h");mk(h,"abs z","a");mk(h,"br","b");mk(h,"","st");mk(l,"fix","f");mk(l,"pg","p");
var later=mk(h,"","later");later.className="abs";
geo("r","h","a","b","st","f","p","later","end");cs("a","position","left","top","zIndex");cs("r","position","left");cs("st","position")
</script></body></html>
