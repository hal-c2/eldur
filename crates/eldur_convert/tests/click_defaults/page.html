<!doctype html><html><head><meta charset="utf-8"><title>NAME</title>
<style>
body { margin: 0; font: 16px sans-serif }
#wrap, label, #mv, #ov, #dn, #cap, #capgo, #upgo, #dngo, #bt9 { display: block; width: 200px; height: 40px }
input:not([type=hidden]) { display: block; margin: 0 }
#capgo, #upgo { position: absolute; left: 300px }
#capgo { top: 0 }
#upgo { top: 60px }
#dngo { position: absolute; left: 550px; top: 0 }
#pp, #xc, #yc, #lab8, #tf8, #lab10, #pd10, #tp { position: absolute; left: 300px; margin: 0; width: 200px; height: 40px }
#pp { top: 120px }
#xc { top: 170px }
#yc { top: 220px }
#lab8 { top: 270px }
#tf8 { top: 320px; height: 30px }
#lab10 { top: 370px }
#pd10 { top: 420px }
#tp { top: 470px; width: auto; height: auto }
#lab11 { position: absolute; left: 550px; top: 60px }
#tf11 { position: absolute; left: 0; top: 50px; width: 150px; height: 30px }
#pop { inset: auto; right: 0; bottom: 0; margin: 0; width: 100px; height: 30px }
</style>
</head><body>
<a id="wrap" href="#go"><label id="lab" for="box">once</label></a>
<input type="checkbox" id="box">
<label id="lab2" for="box2">twice</label>
<input type="checkbox" id="box2">
<label id="lab3" for="box3">first</label>
<input type="checkbox" id="box3">
<label id="lab4" for="box4">later</label>
<input type="checkbox" id="box4">
<label id="lab5" for="box5">quick</label>
<input type="checkbox" id="box5">
<label id="lab6" for="box6">again</label>
<input type="checkbox" id="box6">
<label id="lab7" for="box7">onward</label>
<input type="checkbox" id="box7">
<div id="mv">moved</div>
<div id="ov">over</div>
<div id="dn">down</div>
<div id="cap">held</div>
<a id="capgo" href="#capgo"><div id="cap2">held in a link</div></a>
<a id="upgo" href="#upgo"><div id="up2">up in a link</div></a>
<a id="dngo" href="#dngo"><div id="dn2">down in a link</div></a>
<div id="pp">pops</div>
<div id="pop" popover>popped</div>
<div id="xc">grab</div>
<div id="yc">then</div>
<label id="lab8" for="tf8">field</label>
<input id="tf8">
<label id="lab10" for="pd10">panel</label>
<div id="pd10">panel</div>
<label id="lab11">hidden first<input type="hidden" name="t"><input id="tf11"></label>
<p id="tp"><a href="#tl1">a link in a paragraph</a> <a href="#tl2">b</a></p>
<form id="f9"><button id="bt9"><div id="in9">send</div></button></form>
<script>
// The host makes page Next when this one's title says so.
var name = document.title;
function L() { console.log("LC " + name + " " + [].slice.call(arguments).join(" ")); }
["mousedown", "mouseup", "click", "dblclick"].forEach(function(type) {
  document.addEventListener(type, function(e) { L(type, e.target.id, e.detail); });
});
window.addEventListener("hashchange", function() { L("hashchange", location.hash); });
// A label's click on its box is the press's first default: the box's listener
// makes another page, and the link the label is in follows nothing on it.
document.getElementById("box").addEventListener("click", function() { if (name === "A") document.title = "Next"; });
// The same on a double click's second press: no dblclick for either page.
var twice = 0;
document.getElementById("box2").addEventListener("click", function() { if (name === "A" && ++twice === 2) document.title = "Next"; });
// Its label's own listeners go with the page: a document's are gone already.
document.getElementById("lab2").addEventListener("dblclick", function(e) { L("lab2 own dblclick", e.detail); });
// And on its first: the second press is the new page's. Qt gives it to A's
// label under Next's too, whose `for` names an id Next has as well: neither
// A's box nor Next's is clicked by it, so Next's box hears one click, its own
// label's.
document.getElementById("box3").addEventListener("click", function() { if (name === "A") document.title = "Next"; });
// A swap that waits for the microtasks after the box's listener is still in
// the press: the dblclick after it is neither page's.
var late = 0;
document.getElementById("box4").addEventListener("click", function() {
  if (name === "A" && ++late === 2) Promise.resolve().then(function() { document.title = "Next"; });
});
// A press where the pointer was not: the move it makes first makes Next.
var moved = 0;
document.getElementById("mv").addEventListener("mousemove", function() {
  if (name === "A" && !moved++) { L("move swaps"); document.title = "Next"; }
});
// As box3, with the second press already there when the first click runs.
document.getElementById("box5").addEventListener("click", function() { if (name === "A") document.title = "Next"; });
// As box5, and the second press's way onto Next's label makes page C: the
// press goes on to C.
document.getElementById("box6").addEventListener("click", function() { if (name === "A") document.title = "Next"; });
document.getElementById("lab6").addEventListener("pointerover", function() {
  if (name === "Next") { L("over makes C"); document.title = "C"; }
});
// As box5, and a move on Next's label makes page C: the press after it is C's.
document.getElementById("box7").addEventListener("click", function() { if (name === "A") document.title = "Next"; });
document.getElementById("lab7").addEventListener("mousemove", function() {
  if (name === "Next") { L("move makes C"); document.title = "C"; }
});
// A press whose mousedown makes Next: its release lands on Next alone.
document.getElementById("dn").addEventListener("mousedown", function() { if (name === "A") document.title = "Next"; });
// A move whose first boundary event makes Next: the rest of it is neither
// page's, and Next's hover starts at the next move, from nothing.
var ov = document.getElementById("ov");
["pointerover", "pointerenter", "pointerout", "pointerleave", "mouseover", "mouseenter", "mouseout", "mouseleave"].forEach(function(type) {
  ov.addEventListener(type, function(e) { L(type, e.target.id); });
});
ov.addEventListener("pointerover", function() { if (name === "A") { L("over swaps"); document.title = "Next"; } });
// As box3, on the text in a button: the second press is Next's, and its click
// goes on up to the button, which submits its form.
document.getElementById("in9").addEventListener("click", function(e) {
  if (name === "A") { e.preventDefault(); document.title = "Next"; }
});
document.getElementById("f9").addEventListener("submit", function(e) { e.preventDefault(); L("submit", e.submitter.id); });
// A press that captured the pointer, whose lostpointercapture after the
// release makes Next: the click is neither page's.
var cap = document.getElementById("cap");
cap.addEventListener("pointerdown", function(e) { cap.setPointerCapture(e.pointerId); });
cap.addEventListener("lostpointercapture", function() {
  if (name === "A") { L("lost makes Next"); document.title = "Next"; }
});
// The same in a link, and a link whose mouseup makes Next: the release's
// click is neither page's, so neither follows the link.
var cap2 = document.getElementById("cap2");
cap2.addEventListener("pointerdown", function(e) { cap2.setPointerCapture(e.pointerId); });
cap2.addEventListener("lostpointercapture", function() {
  if (name === "A") { L("lost makes Next"); document.title = "Next"; }
});
// A link whose mousedown makes Next: its release still comes to A's link,
// and neither page follows it.
document.getElementById("dn2").addEventListener("mousedown", function() {
  if (name === "A") { L("down makes Next"); document.title = "Next"; }
});
document.getElementById("up2").addEventListener("mouseup", function() {
  if (name === "A") { L("up makes Next"); document.title = "Next"; }
});
// A popover a press opens, which its own release light-dismisses: the
// dismissal's beforetoggle makes Next, and the click is neither page's.
var pop = document.getElementById("pop");
document.getElementById("pp").addEventListener("click", function(e) { e.stopPropagation(); L("pp own click", e.detail); });
document.getElementById("pp").addEventListener("pointerdown", function() { if (name === "A") pop.showPopover(); });
pop.addEventListener("beforetoggle", function(e) {
  if (name === "A" && e.newState === "closed") { L("dismiss makes Next"); document.title = "Next"; }
});
// A capture passed from one element to another: the first one's
// lostpointercapture makes Next, and the second is told nothing.
var xc = document.getElementById("xc");
var yc = document.getElementById("yc");
xc.addEventListener("pointerdown", function(e) { xc.setPointerCapture(e.pointerId); });
xc.addEventListener("gotpointercapture", function(e) { if (name === "A") yc.setPointerCapture(e.pointerId); });
xc.addEventListener("lostpointercapture", function() {
  if (name === "A") { L("lost xc makes Next"); document.title = "Next"; }
});
yc.addEventListener("gotpointercapture", function() { L("got yc"); });
// A label's field, whose focus makes Next: the field's click is neither page's.
document.getElementById("tf8").addEventListener("focus", function() {
  if (name === "A") { L("focus makes Next"); document.title = "Next"; }
});
document.getElementById("tf8").addEventListener("click", function(e) { e.stopPropagation(); L("tf8 own click", e.detail); });
// As box5 on a label for a div, which is no control: the second press is
// handed to Next, whose label's click activates nothing.
document.getElementById("lab10").addEventListener("click", function() { if (name === "A") document.title = "Next"; });
document.getElementById("pd10").addEventListener("click", function(e) { e.stopPropagation(); L("pd10 own click", e.detail); });
// A paragraph of links, whose mousedown makes Next: its release still comes
// to A's text, and neither page follows the link.
var tp = document.getElementById("tp");
tp.addEventListener("mousedown", function(e) {
  e.stopPropagation();
  if (name === "A") { L("text down makes Next"); document.title = "Next"; }
});
tp.addEventListener("mouseup", function(e) { e.stopPropagation(); });
// A label whose first input is hidden, which is no control: its control is
// the field after it, whose click makes Next.
document.getElementById("lab11").addEventListener("click", function() {
  L("lab11 control", this.control ? this.control.id || "(no id)" : "none");
});
document.getElementById("tf11").addEventListener("click", function(e) {
  e.stopPropagation();
  L("tf11 own click", e.detail);
  if (name === "A") document.title = "Next";
});
</script>
</body></html>
