<!doctype html><html><head><meta charset="utf-8"><title>NAME</title>
<style>
body { margin: 0; font: 16px sans-serif }
#wrap, label, #mv, #ov { display: block; width: 200px; height: 40px }
input { display: block; margin: 0 }
</style>
</head><body>
<a id="wrap" href="#go"><label id="lab" for="box">once</label></a>
<input type="checkbox" id="box">
<label id="lab2" for="box2">twice</label>
<input type="checkbox" id="box2">
<label id="lab3" for="box3">first</label>
<input type="checkbox" id="box3">
<label id="lab4" for="box4">later</label>
<input type="checkbox" id="box4">
<label id="lab5" for="box5">quick</label>
<input type="checkbox" id="box5">
<div id="mv">moved</div>
<div id="ov">over</div>
<script>
// The host makes page Next when this one's title says so.
var name = document.title;
function L() { console.log("LC " + name + " " + [].slice.call(arguments).join(" ")); }
["mousedown", "mouseup", "click", "dblclick"].forEach(function(type) {
  document.addEventListener(type, function(e) { L(type, e.target.id, e.detail); });
});
window.addEventListener("hashchange", function() { L("hashchange", location.hash); });
// A label's click on its box is the press's first default: the box's listener
// makes another page, and the link the label is in follows nothing on it.
document.getElementById("box").addEventListener("click", function() { if (name === "A") document.title = "Next"; });
// The same on a double click's second press: no dblclick for either page.
var twice = 0;
document.getElementById("box2").addEventListener("click", function() { if (name === "A" && ++twice === 2) document.title = "Next"; });
// Its label's own listeners go with the page: a document's are gone already.
document.getElementById("lab2").addEventListener("dblclick", function(e) { L("lab2 own dblclick", e.detail); });
// And on its first: the second press is the new page's.
document.getElementById("box3").addEventListener("click", function() { if (name === "A") document.title = "Next"; });
// A swap that waits for the microtasks after the box's listener is still in
// the press: the dblclick after it is neither page's.
var late = 0;
document.getElementById("box4").addEventListener("click", function() {
  if (name === "A" && ++late === 2) Promise.resolve().then(function() { document.title = "Next"; });
});
// A press where the pointer was not: the move it makes first makes Next.
var moved = 0;
document.getElementById("mv").addEventListener("mousemove", function() {
  if (name === "A" && !moved++) { L("move swaps"); document.title = "Next"; }
});
// As box3, with the second press already there when the first click runs.
document.getElementById("box5").addEventListener("click", function() { if (name === "A") document.title = "Next"; });
// A move whose first boundary event makes Next: the rest of it is neither
// page's, and Next's hover starts at the next move, from nothing.
var ov = document.getElementById("ov");
["pointerover", "pointerenter", "pointerout", "pointerleave", "mouseover", "mouseenter", "mouseout", "mouseleave"].forEach(function(type) {
  ov.addEventListener(type, function(e) { L(type, e.target.id); });
});
ov.addEventListener("pointerover", function() { if (name === "A") { L("over swaps"); document.title = "Next"; } });
</script>
</body></html>
