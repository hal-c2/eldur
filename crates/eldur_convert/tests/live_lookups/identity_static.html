<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>identity_static</title><style>span,i,b,em{display:block}</style></head>
<body>
<div id="a" class="k"><span id="s">s</span></div><div id="b" class="k">b</div><button id="go" onclick="clicked(this)">go</button>
<script>
function L(k,v){console.log("LC "+k+" "+v)}
function ids(l){var r=[];for(var i=0;i<l.length;i++){r.push(l[i].id||l[i].className||l[i].tagName)}return r.join(",")}

function idOf(e){return e.id}
function same(x,y){return x===y}
var a=document.getElementById("a");
L("arg",idOf(a)+" "+idOf(document.getElementById("b")));
L("eq",same(a,document.getElementById("a"))+" "+same(a,document.querySelector("#a")));
var list=document.querySelectorAll(".k");
L("list",list.length+" "+list[0].id+" "+same(list[0],a)+" "+list.item(1).id+" "+list.item(5));
var seen=[];list.forEach(function(e,i){seen.push(i+e.id)});L("forEach",seen.join(","));
var seen2=[];for(var e of document.querySelectorAll(".k")){seen2.push(e.id)}L("of",seen2.join(","));
var col=document.getElementsByClassName("k");
L("collection",col.length+" "+col[1].id+" "+col.item(0).id+" "+(typeof col.forEach)+" "+col.namedItem("b").id);
L("tag",document.getElementsByTagName("span")[0].id);
L("missing",document.getElementById("nope")+" "+document.querySelector(".nope")+" "+document.querySelectorAll(".nope").length+" "+document.getElementsByClassName("nope").length);
var arr=[a,document.querySelector("#b")];L("array",arr[0].id+" "+arr[1].id);
var o={el:document.getElementById("s")};L("object",o.el.id);
var maybe=document.getElementById("s");if(!maybe){L("no","x")}maybe=maybe||a;L("reassigned",maybe.id);
function clicked(t){L("this",idOf(t)+" "+same(t,document.getElementById("go")))}
</script>
</body></html>
