<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>handlers</title><style>span,i,b,em{display:block}</style></head>
<body>
<button id="go">go</button><div id="box"><span id="a" class="m">a</span></div><div id="out">o</div>
<script>
function L(k,v){console.log("LC "+k+" "+v)}
function ids(l){var r=[];for(var i=0;i<l.length;i++){r.push(l[i].id||l[i].className||l[i].tagName)}return r.join(",")}

var count=0;
function report(){
  L("report",count+" "+document.querySelectorAll(".m").length+" "+document.getElementsByClassName("m").length+" "+(document.getElementById("a")===null)+" "+(document.getElementById("made")!==null));
}
report();
document.getElementById("go").addEventListener("click",function(){
  count++;
  report();
  if(document.getElementById("a")){document.getElementById("a").remove()}
  var c=document.createElement("span");c.className="m";c.id="made";document.getElementById("box").appendChild(c);
  report();
  document.getElementById("out").textContent="x"+count;
  L("out",document.getElementById("out").textContent);
});
</script>
</body></html>
