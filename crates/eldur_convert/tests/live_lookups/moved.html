<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>moved</title><style>span,i,b,em{display:block}</style></head>
<body>
<div id="one"><span id="m1" class="n">1</span><span id="m2" class="n">2</span></div><div id="two"><span id="m3" class="n">3</span></div>
<script>
function L(k,v){console.log("LC "+k+" "+v)}
function ids(l){var r=[];for(var i=0;i<l.length;i++){r.push(l[i].id||l[i].className||l[i].tagName)}return r.join(",")}

var one=document.getElementById("one"),two=document.getElementById("two");
L("start",ids(document.querySelectorAll(".n")));
two.appendChild(document.getElementById("m1"));
L("appended",ids(document.querySelectorAll(".n")));
L("in one",ids(one.querySelectorAll(".n"))+" in two "+ids(two.querySelectorAll(".n")));
one.insertBefore(document.getElementById("m3"),document.getElementById("m2"));
L("inserted",ids(document.querySelectorAll(".n")));
two.prepend(document.getElementById("m2"));
L("prepended",ids(document.querySelectorAll(".n")));
L("first",document.querySelector(".n").id);
L("byclass",ids(two.getElementsByClassName("n")));
L("nested",document.querySelectorAll("#two > .n").length);
var off=document.createElement("div");
off.appendChild(document.getElementById("m1"));
L("into detached",document.getElementById("m1")+" "+ids(document.querySelectorAll(".n"))+" "+ids(off.querySelectorAll(".n")));
var f=document.createDocumentFragment();f.appendChild(document.getElementById("m2"));
L("into fragment",document.getElementById("m2")+" "+f.querySelector("#m2").id);
one.appendChild(f);
L("back",document.getElementById("m2").id+" "+ids(one.children));
</script>
</body></html>
