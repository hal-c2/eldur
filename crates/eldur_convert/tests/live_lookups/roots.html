<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>roots</title></head>
<body>
<main id="m"><div class="d" id="d1">1</div><div class="d" id="d2">2</div></main>
<script>
function L(k,v){console.log("LC "+k+" "+v)}
function ids(l){var r=[];for(var i=0;i<l.length;i++){r.push(l[i].id||l[i].className||l[i].tagName)}return r.join(",")}

L("body",(document.querySelector("body")===document.body)+" "+(document.getElementsByTagName("body")[0]===document.body));

L("divs",document.querySelectorAll("div").length+" "+document.body.querySelectorAll("div").length+" "+document.body.getElementsByTagName("div").length);
L("chain",document.querySelectorAll("body > main > div").length+" "+document.querySelectorAll("html div").length);
var c=document.createElement("div");document.body.appendChild(c);
L("after",document.querySelectorAll("div").length+" "+document.querySelectorAll("body > div").length);

</script>
