<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>held</title></head>
<body>
<div id="x" class="c">x</div><div id="y">y</div>
<script>
function L(k,v){console.log("LC "+k+" "+v)}
function ids(l){var r=[];for(var i=0;i<l.length;i++){r.push(l[i].id||l[i].className||l[i].tagName)}return r.join(",")}

var x=document.getElementById("x");
const y=document.getElementById("y");
x.textContent="one";
x.remove();
L("held",x.textContent+" "+x.id+" "+x.className+" "+document.getElementById("x"));
x.className="d";x.id="x2";
L("detached",x.id+" "+document.getElementById("x2")+" "+document.querySelector(".d"));
y.appendChild(x);
L("in y",document.getElementById("x2")===x);
L("y",y.children.length+" "+y.firstElementChild.id);
var late=document.getElementById("late");
L("late",late);
var n=document.createElement("div");n.id="late";document.body.appendChild(n);
L("late now",late+" "+(document.getElementById("late")===n));
var q=document.querySelector(".later");
L("q",q);
n.className="later";
L("q now",q+" "+document.querySelector(".later").id);
var missing=document.querySelectorAll(".later2");
n.classList.add("later2");
L("static list",missing.length+" "+document.querySelectorAll(".later2").length);
</script>
</body></html>
