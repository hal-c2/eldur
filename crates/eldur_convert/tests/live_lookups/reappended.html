<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>reappended</title></head>
<body>
<div id="w"><p id="k" class="y">k</p><p id="l" class="y">l</p></div>
<script>
function L(k,v){console.log("LC "+k+" "+v)}
function ids(l){var r=[];for(var i=0;i<l.length;i++){r.push(l[i].id||l[i].className||l[i].tagName)}return r.join(",")}

var w=document.getElementById("w");var k=document.getElementById("k");
k.remove();
L("gone",document.getElementById("k")+" "+ids(w.querySelectorAll(".y")));
w.appendChild(k);
L("back",(document.getElementById("k")===k)+" "+ids(w.querySelectorAll(".y")));
L("same",document.querySelector("#k")===k);
var l=w.removeChild(document.getElementById("l"));
L("removed returns",l.id+" "+document.getElementById("l"));
w.insertBefore(l,k);
L("again",ids(w.querySelectorAll("p"))+" "+(w.firstElementChild===document.getElementById("l")));
</script>
</body></html>
