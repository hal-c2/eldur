<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>removed</title><style>span,i,b,em{display:block}</style></head>
<body>
<div id="a" class="x">a</div><div id="b" class="x">b</div><div id="c" class="x">c</div><div id="d" class="x">d</div><div id="p"><i id="q" class="x">q</i></div><div id="r"><i id="s" class="x">s</i></div><div id="t"><i id="u" class="x">u</i></div><div id="v" class="x">v</div>
<script>
function L(k,v){console.log("LC "+k+" "+v)}
function ids(l){var r=[];for(var i=0;i<l.length;i++){r.push(l[i].id||l[i].className||l[i].tagName)}return r.join(",")}

var a=document.getElementById("a");
L("start",document.querySelectorAll(".x").length);
a.remove();
L("byid",document.getElementById("a"));
L("qs",document.querySelector("#a"));
L("qsa",ids(document.querySelectorAll(".x")));
L("byclass",ids(document.getElementsByClassName("x")));
L("bytag",document.getElementsByTagName("div").length);
L("held",a.id+" "+a.parentNode+" "+a.isConnected);
document.body.removeChild(document.getElementById("b"));
L("removeChild",document.getElementById("b"));
document.getElementById("c").replaceWith(document.createElement("div"));
L("replaceWith",document.getElementById("c"));
document.getElementById("p").innerHTML="";
L("innerHTML",document.getElementById("q")+" "+document.querySelector("#q"));
document.getElementById("r").textContent="gone";
L("textContent",document.getElementById("s")+" "+document.querySelectorAll("#r i").length);
document.getElementById("t").replaceChildren();
L("replaceChildren",document.getElementById("u"));
document.body.replaceChild(document.createElement("div"),document.getElementById("v"));
L("replaceChild",document.getElementById("v"));
L("end",ids(document.querySelectorAll(".x")));
</script>
</body></html>
