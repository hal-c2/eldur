<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>clone</title><style>span,i,b,em{display:block}</style></head>
<body>
<div id="o" class="c"><span id="i" class="t">x</span></div><div id="z">z</div>
<script>
function L(k,v){console.log("LC "+k+" "+v)}
function ids(l){var r=[];for(var i=0;i<l.length;i++){r.push(l[i].id||l[i].className||l[i].tagName)}return r.join(",")}

var o=document.getElementById("o");
var d=o.cloneNode(true);
L("unattached",document.querySelectorAll(".c").length+" "+d.id+" "+d.querySelectorAll(".t").length);
document.body.insertBefore(d,o);
L("clones",document.querySelectorAll(".c").length+" "+document.querySelectorAll(".t").length+" "+(document.getElementById("o")===d)+" "+(document.getElementById("i")===d.firstElementChild));
d.id="dd";d.querySelector("#i").id="ii";
L("renamed",(document.getElementById("o")===o)+" "+document.getElementById("i").parentNode.id+" "+document.querySelector("#ii").parentNode.id);
var s=o.cloneNode(false);L("shallow",s.children.length+" "+s.className);
</script>
</body></html>
