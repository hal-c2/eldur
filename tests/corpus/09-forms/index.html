<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account</title>
  <style>
    :root {
      --bg: #f1f4f9;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #5b6478;
      --border: #cfd6e4;
      --accent: #3b6fe0;
      --accent-dark: #2d5bc4;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      font-size: 15px;
      line-height: 1.4;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(20, 30, 60, 0.12);
      padding: 28px 32px;
    }

    .card__title {
      margin: 0 0 4px;
      font-size: 24px;
      font-weight: 700;
    }

    .card__subtitle {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .field__label {
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 600;
    }

    .input {
      width: 100%;
      padding: 9px 12px;
      font: inherit;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 111, 224, 0.2);
    }

    textarea.input {
      min-height: 76px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .check input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .group {
      margin: 0;
      padding: 10px 12px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .group legend {
      padding: 0 6px;
      font-size: 14px;
      font-weight: 600;
    }

    .options {
      display: flex;
      gap: 18px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .option input {
      margin: 0;
      accent-color: var(--accent);
    }

    .hint {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 6px;
    }

    .btn {
      padding: 10px 18px;
      font: inherit;
      font-weight: 600;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
    }

    .btn--primary {
      background: var(--accent);
      color: #fff;
    }

    .btn--primary:hover {
      background: var(--accent-dark);
    }

    .btn--secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }

    .btn--secondary:hover {
      background: #f5f7fb;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="card__title">Create your account</h1>
    <p class="card__subtitle">Start with a free workspace. No credit card needed.</p>

    <form class="form" action="#" method="post">
      <div class="field">
        <label class="field__label" for="name">Full name</label>
        <input class="input" type="text" id="name" name="name" placeholder="Ada Lovelace">
      </div>

      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email" placeholder="you@example.com">
      </div>

      <div class="field">
        <label class="field__label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" placeholder="At least 8 characters">
      </div>

      <div class="field">
        <label class="field__label" for="team">Team size</label>
        <select class="input" id="team" name="team">
          <option value="1">Just me</option>
          <option value="2" selected>2 to 10 people</option>
          <option value="3">11 to 50 people</option>
          <option value="4">More than 50 people</option>
        </select>
      </div>

      <div class="field">
        <label class="field__label" for="bio">About you</label>
        <textarea class="input" id="bio" name="bio" rows="3" placeholder="What will you build?"></textarea>
      </div>

      <fieldset class="group">
        <legend>Plan</legend>
        <div class="options">
          <label class="option"><input type="radio" name="plan" value="free" checked> Free</label>
          <label class="option"><input type="radio" name="plan" value="pro"> Pro</label>
          <label class="option"><input type="radio" name="plan" value="team"> Team</label>
        </div>
      </fieldset>

      <div class="row">
        <div class="field">
          <label class="field__label" for="seats">Seats</label>
          <input class="input" type="number" id="seats" name="seats" min="1" max="10" value="2">
        </div>
        <div class="field">
          <label class="field__label" for="volume">Notification volume</label>
          <input type="range" id="volume" name="volume" min="0" max="100" value="40">
          <p class="hint">Adjust how often we email you.</p>
        </div>
      </div>

      <label class="check">
        <input type="checkbox" name="terms" required>
        I agree to the terms of service
      </label>

      <div class="actions">
        <button class="btn btn--secondary" type="reset">Reset</button>
        <button class="btn btn--primary" type="submit">Create account</button>
      </div>
    </form>
  </main>
</body>
</html>
