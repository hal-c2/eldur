<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flex Sidebar App Test</title>
<style>
* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  font-family: sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: #1c2331;
  background: #f4f6fa;
}

.app {
  display: flex;
  height: 100vh;
}

.sidebar {
  flex: 0 0 240px;
  width: 240px;
  display: flex;
  flex-direction: column;
  padding: 20px 12px;
  background: #1b2233;
  color: #c9d1e3;
}

.brand {
  padding: 8px 12px 20px;
  font-size: 1.25rem;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.01em;
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.menu-item {
  display: block;
  padding: 10px 12px;
  border-radius: 6px;
  color: inherit;
  text-decoration: none;
  font-weight: 500;
}

.menu-item:hover {
  background: #252e46;
  color: #ffffff;
}

.menu-item.is-active {
  background: #2f3b5a;
  color: #ffffff;
  box-shadow: inset 3px 0 0 #5b9be6;
}

.menu-label {
  margin: 20px 12px 6px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #7d8aa6;
}

.main {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: #f4f6fa;
}

.main-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 20px 28px;
  background: #ffffff;
  border-bottom: 1px solid #e1e5ee;
}

.main-header h1 {
  margin: 0;
  font-size: 1.375rem;
  font-weight: 700;
  color: #111827;
}

.search input {
  width: 280px;
  padding: 8px 12px;
  border: 1px solid #c8d0de;
  border-radius: 6px;
  background: #ffffff;
  font: inherit;
  color: #1c2331;
}

.search input::placeholder {
  color: #8a93a6;
}

.content {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 24px 28px;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
}

.stat {
  flex: 1 1 180px;
  padding: 16px 18px;
  background: #ffffff;
  border: 1px solid #e1e5ee;
  border-radius: 8px;
}

.stat-label {
  margin: 0 0 4px;
  font-size: 0.8125rem;
  color: #5b6375;
}

.stat-value {
  margin: 0;
  font-size: 1.625rem;
  font-weight: 700;
  color: #111827;
}

.panel {
  padding: 16px 18px;
  background: #ffffff;
  border: 1px solid #e1e5ee;
  border-radius: 8px;
}

.panel h2 {
  margin: 0 0 12px;
  font-size: 1rem;
  font-weight: 600;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid #eef1f6;
}

.row:first-of-type {
  border-top: none;
}

.pill {
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 0.8125rem;
  background: #e3f1e6;
  color: #1e6b36;
}

.pill.is-warn {
  background: #fdf0dc;
  color: #8a5200;
}

.footer {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 28px;
  background: #ffffff;
  border-top: 1px solid #e1e5ee;
  font-size: 0.8125rem;
  color: #5b6375;
}

.footer a {
  color: #0b5cad;
  text-decoration: none;
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Atlas</div>
    <nav class="menu">
      <a class="menu-item is-active" href="#" aria-current="page">Dashboard</a>
      <a class="menu-item" href="#">Projects</a>
      <a class="menu-item" href="#">Tasks</a>
      <a class="menu-item" href="#">Calendar</a>
      <a class="menu-item" href="#">Messages</a>
    </nav>
    <p class="menu-label">Workspace</p>
    <nav class="menu">
      <a class="menu-item" href="#">Members</a>
      <a class="menu-item" href="#">Billing</a>
      <a class="menu-item" href="#">Settings</a>
    </nav>
  </aside>

  <main class="main">
    <header class="main-header">
      <h1>Dashboard</h1>
      <form class="search" role="search">
        <input type="search" placeholder="Search projects" aria-label="Search projects">
      </form>
    </header>

    <div class="content">
      <div class="stats">
        <div class="stat">
          <p class="stat-label">Open tasks</p>
          <p class="stat-value">128</p>
        </div>
        <div class="stat">
          <p class="stat-label">Completed this week</p>
          <p class="stat-value">46</p>
        </div>
        <div class="stat">
          <p class="stat-label">Team members</p>
          <p class="stat-value">12</p>
        </div>
      </div>

      <section class="panel">
        <h2>Recent projects</h2>
        <div class="row">
          <span>Website redesign</span>
          <span class="pill">On track</span>
        </div>
        <div class="row">
          <span>Mobile release 2.4</span>
          <span class="pill is-warn">At risk</span>
        </div>
        <div class="row">
          <span>Quarterly report</span>
          <span class="pill">On track</span>
        </div>
      </section>
    </div>

    <footer class="footer">
      <span>Atlas workspace &middot; v4.2</span>
      <a href="#">Help centre</a>
    </footer>
  </main>
</div>
</body>
</html>
