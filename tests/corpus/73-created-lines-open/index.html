<!doctype html>
<!-- The same page made open: a createElement the analysis cannot follow, so the runtime lays every box out from the rules. -->
<html><head><meta charset="utf-8"><title>Script made lines, open page</title>
<style>
body { margin: 0; padding: 16px; font: 14px Arial, sans-serif; color: #222; }
#chat { width: 360px; border: 1px solid #ccc; padding: 6px; margin-bottom: 12px; }
.msg { background: #eef; border-radius: 8px; padding: 6px 10px; margin: 4px 0; line-height: 1.4; }
.msg b { color: #036; }
.msg a { color: #a00; }
.msg code { font: 12px monospace; background: #ddd; padding: 0 3px; }
#log { width: 300px; height: 80px; white-space: pre-wrap; font: 12px monospace; background: #111; color: #9f9; padding: 6px; margin-bottom: 12px; }
#card { width: 320px; text-align: center; overflow-wrap: anywhere; margin-bottom: 12px; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 9px; background: #c33; color: #fff; font-size: 11px; }
#icons { width: 300px; }
.icon { display: inline-block; width: 12px; height: 12px; background: #39c; vertical-align: middle; }
sup.n { vertical-align: super; font-size: 10px; }
</style></head><body>
<div id="chat"></div>
<div id="log"></div>
<div id="card"></div>
<p id="icons"></p>
<script>
const kinds = ["div"];
document.createElement(kinds[0]);
const chat = document.getElementById('chat');
[['Ana', 'sent the numbers, see', 'report', 'q3.xls'],
 ['Bjorn', 'the totals on the second sheet do not add up, check', 'sheet two', 'SUM(B2:B9)']].forEach((d) => {
  const m = document.createElement('div');
  m.className = 'msg';
  const b = document.createElement('b');
  b.textContent = d[0];
  m.appendChild(b);
  m.appendChild(document.createTextNode(' ' + d[1] + ' '));
  const a = document.createElement('a');
  a.href = '#';
  a.textContent = d[2];
  m.appendChild(a);
  m.appendChild(document.createTextNode(' and '));
  const c = document.createElement('code');
  c.textContent = d[3];
  m.appendChild(c);
  chat.appendChild(m);
});
const log = document.getElementById('log');
['build started', 'compiling   3 crates', 'done'].forEach((line) => {
  const s = document.createElement('span');
  s.textContent = line + '\n';
  log.appendChild(s);
});
document.getElementById('card').innerHTML =
  'New <span class="badge">3</span> messages from <em>support</em>: averyveryverylongwordwithoutanyspaces';
const icons = document.getElementById('icons');
icons.append('Status ');
const i = document.createElement('span');
i.className = 'icon';
icons.appendChild(i);
icons.append(' ready');
const n = document.createElement('sup');
n.className = 'n';
n.textContent = '2';
icons.appendChild(n);
</script></body></html>
