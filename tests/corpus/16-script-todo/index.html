<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo List</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: sans-serif;
  color: #1f2430;
  background: #eef1f7;
  padding: 48px 16px;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 28px;
  border-radius: 16px;
  background: #ffffff;
  box-shadow: 0 10px 30px rgba(31, 36, 48, 0.12);
}

.app-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 20px;
}

.app-header h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  color: #3a4256;
}

.counter {
  margin: 0;
  color: #6b7280;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.composer {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.composer input {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid #c9d1e0;
  border-radius: 8px;
  font-size: 16px;
  color: #1f2430;
}

.composer input:focus {
  outline: 2px solid #1d4ed8;
  outline-offset: 0;
  border-color: transparent;
}

.btn {
  padding: 10px 18px;
  border: 0;
  border-radius: 8px;
  background: #1d4ed8;
  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.btn:hover {
  background: #1a44c2;
}

.btn:focus-visible {
  outline: 2px solid #1d4ed8;
  outline-offset: 2px;
}

.todo-list {
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid #e3e7ef;
}

.todo-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px solid #e3e7ef;
}

.todo-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  margin: 0;
  flex: 0 0 auto;
  cursor: pointer;
}

.todo-text {
  flex: 1;
  min-width: 0;
  font-size: 16px;
  word-break: break-word;
}

.todo-item.done .todo-text {
  color: #9aa3b5;
  text-decoration: line-through;
}

.delete {
  padding: 4px 10px;
  border: 1px solid #e3b5b5;
  border-radius: 6px;
  background: #fff5f5;
  color: #b42318;
  font-size: 13px;
  cursor: pointer;
}

.delete:hover {
  background: #fde2e2;
}

.empty {
  margin: 16px 0 0;
  color: #6b7280;
  font-size: 15px;
  text-align: center;
}

.empty[hidden] {
  display: none;
}

.footer-note {
  margin: 24px 0 0;
  color: #9aa3b5;
  font-size: 12px;
  text-align: center;
}

@media (max-width: 480px) {
  body {
    padding: 16px 8px;
  }

  .app {
    padding: 18px;
  }

  .app-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }
}
</style>
</head>
<body>
<main class="app">
  <header class="app-header">
    <h1>Today</h1>
    <p class="counter" id="counter">0 items left</p>
  </header>

  <div class="composer">
    <input id="todo-input" type="text" placeholder="What needs doing?" autocomplete="off">
    <button type="button" class="btn" id="add-btn">Add</button>
  </div>

  <ul class="todo-list" id="todo-list"></ul>
  <p class="empty" id="empty" hidden>Nothing here yet.</p>

  <p class="footer-note">Saved in this browser.</p>
</main>

<script>
  var STORAGE_KEY = 'h2q-todos';

  var INITIAL_TODOS = [
    { id: 1, text: 'Review the design tokens', done: false },
    { id: 2, text: 'Write release notes', done: false },
    { id: 3, text: 'Book the quarterly review', done: true }
  ];

  var todos = [];
  var nextId = 1;

  var input = document.getElementById('todo-input');
  var addButton = document.getElementById('add-btn');
  var list = document.getElementById('todo-list');
  var counter = document.getElementById('counter');
  var empty = document.getElementById('empty');

  function loadTodos() {
    try {
      var saved = window.localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : null;
    } catch (error) {
      return null;
    }
  }

  function saveTodos() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (error) {
      // Storage can be unavailable (private mode, quota); the list still works in memory.
    }
  }

  function computeNextId() {
    var max = 0;
    for (var i = 0; i < todos.length; i++) {
      if (todos[i].id > max) {
        max = todos[i].id;
      }
    }
    return max + 1;
  }

  function render() {
    list.textContent = '';

    for (var i = 0; i < todos.length; i++) {
      list.appendChild(createItem(todos[i]));
    }

    var remaining = todos.filter(function (todo) { return !todo.done; }).length;
    counter.textContent = remaining + ' ' + (remaining === 1 ? 'item' : 'items') + ' left';
    empty.hidden = todos.length > 0;
  }

  function createItem(todo) {
    var li = document.createElement('li');
    li.className = 'todo-item' + (todo.done ? ' done' : '');

    var checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = todo.done;
    checkbox.addEventListener('change', function () {
      todo.done = checkbox.checked;
      saveTodos();
      render();
    });

    var text = document.createElement('span');
    text.className = 'todo-text';
    text.textContent = todo.text;

    var remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'delete';
    remove.textContent = 'Delete';
    remove.addEventListener('click', function () {
      todos = todos.filter(function (item) { return item.id !== todo.id; });
      saveTodos();
      render();
    });

    li.appendChild(checkbox);
    li.appendChild(text);
    li.appendChild(remove);
    return li;
  }

  function addFromInput() {
    var text = input.value.trim();
    if (text === '') {
      return;
    }

    todos.push({ id: nextId, text: text, done: false });
    nextId += 1;
    input.value = '';
    saveTodos();
    render();
    input.focus();
  }

  addButton.addEventListener('click', addFromInput);

  input.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      addFromInput();
    }
  });

  document.addEventListener('DOMContentLoaded', function () {
    var saved = loadTodos();
    todos = saved || INITIAL_TODOS.map(function (todo) {
      return { id: todo.id, text: todo.text, done: todo.done };
    });
    nextId = computeNextId();
    render();
  });
</script>
</body>
</html>
