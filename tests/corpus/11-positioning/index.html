<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Positioning examples</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-top: 88px;
      background: #f3f5f8;
      color: #1f2937;
      font-family: sans-serif;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 1px 0 #d9dee8;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: #3b6fe0;
    }

    .nav {
      display: flex;
      gap: 24px;
    }

    .nav a {
      color: #374151;
      text-decoration: none;
      font-size: 15px;
    }

    .page {
      display: flex;
      flex-direction: column;
      gap: 32px;
      padding: 0 40px;
    }

    .page-title {
      margin: 0;
      font-size: 26px;
    }

    .row {
      display: flex;
      align-items: flex-start;
      gap: 48px;
    }

    .card {
      position: relative;
      width: 340px;
      padding: 24px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .card p {
      margin: 0 0 16px;
      color: #4b5563;
      line-height: 1.5;
    }

    .badge {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e74c3c;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tooltip-wrap {
      position: relative;
      display: inline-block;
      margin-top: 64px;
    }

    .btn {
      padding: 10px 18px;
      font: inherit;
      font-weight: 600;
      color: #ffffff;
      background: #3b6fe0;
      border: none;
      border-radius: 8px;
    }

    .tooltip {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 10px;
      background: #1f2937;
      color: #ffffff;
      font-size: 13px;
      white-space: nowrap;
      border-radius: 6px;
    }

    .tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -6px;
      border: 6px solid transparent;
      border-top-color: #1f2937;
    }

    .media {
      position: relative;
      width: 320px;
      height: 220px;
      margin: 0;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, #7f9cf5, #b6c8ff 55%, #f7d6e0);
    }

    .media::before {
      content: "";
      position: absolute;
      top: 48px;
      left: 50%;
      width: 80px;
      height: 80px;
      margin-left: -40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
    }

    .media__caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      margin: 0;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      font-size: 14px;
    }

    .stack {
      position: relative;
      width: 240px;
      height: 200px;
    }

    .layer {
      position: absolute;
      width: 180px;
      height: 120px;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
    }

    .layer--back {
      top: 0;
      left: 0;
      z-index: 1;
      background: #f9c74f;
    }

    .layer--front {
      top: 50px;
      left: 60px;
      z-index: 2;
      background: #43aa8b;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">Acme Studio</div>
    <nav class="nav">
      <a href="#">Work</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="page">
    <h1 class="page-title">Positioning</h1>

    <section class="row">
      <article class="card">
        <span class="badge">3</span>
        <h2>Team update</h2>
        <p>The design review moved to Thursday. Check the shared calendar for the new room.</p>
        <div class="tooltip-wrap">
          <button class="btn" type="button">Follow</button>
          <div class="tooltip" role="tooltip">Get notified about new posts</div>
        </div>
      </article>

      <figure class="media">
        <figcaption class="media__caption">Studio at dusk</figcaption>
      </figure>

      <div class="stack">
        <div class="layer layer--front">Front layer</div>
        <div class="layer layer--back">Back layer</div>
      </div>
    </section>
  </main>
</body>
</html>
