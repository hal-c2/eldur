<!doctype html>
<html><head><meta charset="utf-8"><title>Script filled grid and flex</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; font: 14px/20px Arial, sans-serif; background: #f6f6f6; color: #222; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
.card { background: #fff; border: 1px solid #bbb; padding: 10px; }
.top { align-self: start; background: #e8f4ff; }
.row { display: flex; gap: 10px; margin-bottom: 16px; }
.row > div { background: #fff; border: 1px solid #bbb; padding: 8px; flex: 1; }
.mix { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.middle { align-items: center; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style></head><body>
<div class="grid" id="grid"></div>
<div class="row" id="row"></div>
<div class="mix" id="mix"><div class="card">written in the page</div></div>
<div class="middle" id="middle"></div>
<script>
const fill = (id, cls, texts) => texts.forEach((t) => {
  const c = document.createElement('div');
  c.className = cls;
  c.innerHTML = t;
  document.getElementById(id).append(c);
});
fill('grid', 'card', ['short', 'a much longer card<br>on<br>several<br>lines', 'two<br>lines']);
fill('grid', 'card top', ['starts at the top of its row', 'lines<br>of<br>text']);
fill('row', '', ['one', 'two<br>lines', 'three<br>whole<br>lines']);
fill('mix', 'card', ['created<br>beside<br>it']);
fill('middle', 'card', ['tall<br>tall<br>tall', 'centred']);
</script></body></html>
