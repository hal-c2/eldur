<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Created boxes paint</title>
<style>
:root { --shade: #336; }
body { margin: 0; font: 16px/20px sans-serif; background: #fff; }
#cards { padding: 10px; }
.card { width: 240px; height: 60px; margin: 12px 0 18px; border-radius: 8px; background: linear-gradient(90deg, #f00, var(--shade)); box-shadow: 0 2px 6px rgba(0, 0, 0, .4); transition: transform .2s ease, opacity .2s linear; }
.card:hover { transform: translateX(8px); opacity: .8; }
.ring { width: 120px; height: 40px; margin: 8px 0; background: radial-gradient(circle, #ff0, #0a0); box-shadow: inset 0 0 0 3px #063; transform: rotate(2deg); overflow: hidden; }
</style>
</head>
<body>
<div id="cards"></div>
<script>
var names = ['card', 'ring', 'card'];
var cards = document.getElementById('cards');
names.forEach(function (name) {
  var box = document.createElement('div');
  box.className = name;
  cards.appendChild(box);
});
var read = getComputedStyle(cards.firstElementChild);
cards.setAttribute('data-image', read.backgroundImage);
</script>
</body>
</html>
