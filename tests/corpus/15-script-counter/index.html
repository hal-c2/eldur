<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter Widget</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: sans-serif;
  color: #1f2430;
  background: #eef1f7;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 48px 16px;
}

.widget {
  width: 100%;
  max-width: 520px;
  padding: 32px;
  border-radius: 16px;
  background: #ffffff;
  box-shadow: 0 10px 30px rgba(31, 36, 48, 0.12);
}

.widget h1 {
  margin: 0 0 24px;
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  color: #3a4256;
}

.display {
  margin: 0 0 24px;
  font-size: 96px;
  font-weight: 800;
  line-height: 1;
  text-align: center;
  font-variant-numeric: tabular-nums;
  color: #1d4ed8;
}

.display.negative {
  color: #d62828;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 32px;
}

.btn {
  min-width: 64px;
  padding: 10px 18px;
  border: 1px solid #c9d1e0;
  border-radius: 8px;
  background: #f7f9fc;
  color: #1f2430;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
}

.btn:hover {
  background: #e9eef8;
}

.btn:focus-visible {
  outline: 2px solid #1d4ed8;
  outline-offset: 2px;
}

.btn-primary {
  border-color: #1d4ed8;
  background: #1d4ed8;
  color: #ffffff;
}

.btn-primary:hover {
  background: #1a44c2;
}

.btn-reset {
  color: #5c6578;
  font-size: 16px;
  font-weight: 500;
}

.field {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 600;
  color: #3a4256;
}

.text-input {
  display: block;
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #c9d1e0;
  border-radius: 8px;
  font-size: 16px;
  color: #1f2430;
  background: #ffffff;
}

.text-input:focus {
  outline: 2px solid #1d4ed8;
  outline-offset: 0;
  border-color: transparent;
}

.mirror {
  min-height: 24px;
  margin: 12px 0 24px;
  padding: 12px;
  border-radius: 8px;
  background: #f7f9fc;
  color: #3a4256;
  font-size: 16px;
  word-break: break-word;
}

.toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  font-size: 15px;
  cursor: pointer;
}

.toggle input {
  width: 18px;
  height: 18px;
  margin: 0;
}

.panel {
  padding: 16px;
  border-left: 4px solid #1d4ed8;
  border-radius: 0 8px 8px 0;
  background: #f1f5ff;
  color: #3a4256;
  font-size: 14px;
  line-height: 1.6;
}

.panel h2 {
  margin: 0 0 8px;
  font-size: 15px;
}

.panel p {
  margin: 0;
}

.panel[hidden] {
  display: none;
}
</style>
</head>
<body>
<main class="widget">
  <h1>Counter</h1>

  <div class="display" id="count" aria-live="polite">0</div>

  <div class="controls">
    <button type="button" class="btn" id="dec">&minus;</button>
    <button type="button" class="btn btn-primary" id="inc">+</button>
    <button type="button" class="btn btn-reset" id="reset">Reset</button>
  </div>

  <label class="field" for="mirror-input">Live text</label>
  <input class="text-input" id="mirror-input" type="text" placeholder="Start typing&hellip;" autocomplete="off">
  <p class="mirror" id="mirror-output">Start typing to see it here.</p>

  <label class="toggle">
    <input type="checkbox" id="details-toggle">
    <span>Show details</span>
  </label>

  <section class="panel" id="details" hidden>
    <h2>About this widget</h2>
    <p>The counter goes negative below zero and turns red. Text typed above is mirrored as you type.</p>
  </section>
</main>

<script>
  var count = document.getElementById('count');
  var mirror = document.getElementById('mirror-output');
  var input = document.getElementById('mirror-input');
  var toggle = document.getElementById('details-toggle');
  var panel = document.getElementById('details');
  var n = 0;

  function render() {
    count.textContent = String(n);
    count.classList.toggle('negative', n < 0);
  }

  document.getElementById('inc').addEventListener('click', function () {
    n += 1;
    render();
  });

  document.getElementById('dec').addEventListener('click', function () {
    n -= 1;
    render();
  });

  document.getElementById('reset').addEventListener('click', function () {
    n = 0;
    render();
  });

  input.addEventListener('input', function (event) {
    mirror.textContent = event.target.value;
  });

  toggle.addEventListener('change', function (event) {
    panel.hidden = !event.target.checked;
  });

  render();
</script>
</body>
</html>
