<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Effects on boxes a script makes</title>
<style>
body { margin: 30px; background: #fff; }
#grid { display: grid; grid-template-columns: repeat(5, 150px); gap: 40px; }
#grid div, #late { height: 100px; box-sizing: border-box; padding: 10px; background-color: #3b82f6; }
#grid div div { height: 50px; width: 50px; padding: 0; background-color: #16a34a; }
#grid2 { display: grid; grid-template-columns: 150px; margin-top: 40px; }
#grid2 div { height: 100px; background-color: #3b82f6; }
#grid2 div div { height: 50px; width: 50px; margin: 10px; background-color: #16a34a; }
.group { opacity: .5; background-color: #dc2626 !important; }
.gray { filter: grayscale(1); }
.chain { filter: hue-rotate(90deg) contrast(1.5); }
.blur { filter: blur(4px); }
.drop { filter: drop-shadow(4px 4px 6px #000); }
.fade { filter: opacity(.4); }
.shadow { box-shadow: 0 4px 16px rgba(0,0,0,.5); }
.spread { box-shadow: 0 0 0 6px #f59e0b; }
.many { box-shadow: -8px 0 8px #22c55e, 8px 0 8px #ef4444; }
.em { font-size: 10px; box-shadow: 1em 1em 2em #000; }
</style></head><body><div id="grid"></div><div id="grid2"></div>
<script>
const grid = document.getElementById('grid');
for (const name of ['group', 'gray', 'chain', 'blur', 'drop', 'fade', 'shadow', 'spread', 'many', 'em']) {
  const d = document.createElement('div');
  d.className = name;
  d.id = 'r-' + name;
  d.appendChild(document.createElement('div'));
  grid.appendChild(d);
}
const held = document.createElement('div');
held.id = 'r-margin';
held.appendChild(document.createElement('div'));
document.getElementById('grid2').appendChild(held);
</script></body></html>
