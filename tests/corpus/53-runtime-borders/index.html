<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Borders on boxes a script makes</title>
<style>
body { margin: 30px; background: #fff; }
#grid { display: grid; grid-template-columns: repeat(5, 150px); gap: 30px; }
#grid div { height: 90px; box-sizing: border-box; background-color: #f8fafc; }
.sides { border-style: solid; border-width: 8px; border-color: #dc2626 #16a34a #2563eb #eab308; }
.round { border-style: solid; border-width: 10px; border-color: #dc2626 #16a34a; border-radius: 24px; }
.dashed { border: 4px dashed #0f172a; }
.dotted { border: 6px dotted #dc2626; }
.double { border: 9px double #0f172a; }
.groove { border: 10px groove #64748b; }
.ridge { border: 10px ridge #64748b; }
.inset { border: 10px inset #64748b; }
.outset { border: 10px outset #64748b; }
.dashround { border: 4px dashed #2563eb; border-radius: 20px; }
.line { outline: 3px solid #dc2626; }
.away { outline: 2px solid #2563eb; outline-offset: 6px; }
.oround { outline: 3px solid #7c3aed; border-radius: 20px; }
.odash { outline: 3px dashed #16a34a; outline-offset: 2px; }
.short { outline: 4px double #0f172a; outline-offset: 2px; }
</style></head><body><div id="grid"></div>
<script>
const grid = document.getElementById('grid');
for (const name of ['sides', 'round', 'dashed', 'dotted', 'double', 'groove', 'ridge', 'inset', 'outset', 'dashround', 'line', 'away', 'oround', 'odash', 'short']) {
  const d = document.createElement('div');
  d.className = name;
  d.id = 'r-' + name;
  grid.appendChild(d);
}
</script></body></html>
