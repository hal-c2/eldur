<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colored Box</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #f1f5f9;
    font-family: "Liberation Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    margin: 56px 0 0 64px;
    width: 560px;
    padding: 32px;
    background: #1e293b;
    border: 2px solid #3b82f6;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .badge {
    width: 124px;
    height: 28px;
    border-radius: 6px;
    background: #2563eb;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .heading {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    line-height: 32px;
    color: #f8fafc;
  }
  .body {
    margin: 0;
    font-size: 16px;
    font-weight: 400;
    line-height: 24px;
    color: #cbd5e1;
  }
  .track {
    margin-top: 4px;
    width: 100%;
    height: 12px;
    border-radius: 6px;
    background: #334155;
    overflow: hidden;
  }
  .fill {
    width: 320px;
    height: 12px;
    border-radius: 6px;
    background: #38bdf8;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">STATUS READY</div>
    <h1 class="heading">Build Pipeline Summary</h1>
    <p class="body">Static HTML and CSS boxes map to idiomatic Qt Quick layouts with matching geometry and typography.</p>
    <div class="track"><div class="fill"></div></div>
  </div>
</body>
</html>
