<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard Reference</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #f8fafc;
    font-family: "Liberation Sans", sans-serif;
  }
  .header {
    width: 100%;
    height: 80px;
    padding: 0 48px;
    background: #0f172a;
    color: #ffffff;
    display: flex;
    align-items: center;
    font-size: 24px;
    font-weight: 700;
  }
  .grid {
    margin: 40px 48px;
    display: flex;
    gap: 32px;
  }
  .card-left {
    flex: 1;
    height: 520px;
    padding: 32px;
    border-radius: 16px;
    background: #1d4ed8;
    color: #ffffff;
    font-size: 22px;
    font-weight: 700;
  }
  .card-right {
    flex: 1;
    height: 520px;
    padding: 32px;
    border-radius: 16px;
    background: #047857;
    color: #ffffff;
    font-size: 22px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="header">Reference Dashboard Layout</div>
  <div class="grid">
    <div class="card-left">Primary Analytics Column</div>
    <div class="card-right">Secondary Status Column</div>
  </div>
</body>
</html>
