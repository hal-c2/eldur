name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tasks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      # No Qt here: the end-to-end tests pin Qt 6.11's behaviour and Ubuntu
      # 24.04 ships Qt 6.4, so mise run test skips the tests that run QML in
      # qmltestrunner (it says so in the log; the qml-e2e job below runs
      # them), and tasks:smoke dry-runs qml:check and visual. No Playwright
      # or sway either, for the same reason. numpy and Pillow are for
      # visual:test, whose tests that need Qt, node's Playwright or sway skip.
      - name: Install the visual harness's Python modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-numpy python3-pil shellcheck
      - run: mise run setup
      - run: mise run check
      - run: mise run test
      - run: mise run tasks:smoke

  # The end-to-end tests that run converted QML in Qt 6.11's qmltestrunner.
  # The tasks job has no Qt, so there they skip and pass; here
  # ELDUR_REQUIRE_QT=1 turns any skip, or a runner that cannot be found, into
  # a failure.
  qml-e2e:
    runs-on: ubuntu-24.04
    # The suite takes minutes; a qmltestrunner that never exits must fail
    # the job, not hold the runner for six hours.
    timeout-minutes: 45
    env:
      ELDUR_REQUIRE_QT: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      # The Qt minor the tests and docs/spec measure (qt_pinned in
      # mise-tasks/_lib/common.sh); the patch is the newest 6.11 one.
      # aqtinstall fetches it from Qt's own servers, cached by version.
      - uses: jurplel/install-qt-action@v4.5.0
        with:
          version: "6.11.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          aqtversion: "==3.3.0"
          cache: true
      # Qt's installer ships its tools unsuffixed; the tests and tasks look
      # for Qt 6's by the -6 names or by QMLTESTRUNNER/QMLLINT, because a
      # plain qmltestrunner may be Qt 5's.
      - name: Name Qt 6.11's tools for the tests
        run: |
          bin="$RUNNER_TEMP/qt6-bin"
          mkdir -p "$bin"
          ln -s "$QT_ROOT_DIR/bin/qml" "$bin/qml6"
          echo "$bin" >>"$GITHUB_PATH"
          {
            echo "QMLTESTRUNNER=$QT_ROOT_DIR/bin/qmltestrunner"
            echo "QMLLINT=$QT_ROOT_DIR/bin/qmllint"
          } >>"$GITHUB_ENV"
      # The recorded Chromium geometry (tests/apps/chromium.json and the like)
      # was measured with Liberation 2.1.5 for Arial, Helvetica, serif and
      # sans-serif, and JetBrainsMono Nerd Font 3.5.1 for monospace (the
      # tables in docs/spec/layout.md); fonts_e2e also measures Nimbus Sans
      # (URW base35 20200910) and Noto Sans. Text widths and line heights
      # follow the font, so the runner gets the same files (the Nerd Font
      # archive pinned by checksum) and the same fontconfig rules, system and
      # user (.github/fontconfig): the generic families and the fallback for
      # a glyph those faces lack (a ✓ in Arial) then match.
      # Noto CJK comes from its own releases, not Ubuntu's fonts-noto-cjk:
      # those are byte for byte the files where the recordings were made, and
      # the Ubuntu mirror stalled on that 61 MB package again and again.
      - name: Cache the font downloads
        uses: actions/cache@v4.3.0
        with:
          path: ~/font-downloads
          key: font-downloads-notocjk-sans2.004-serif2.003-nerd3.5.1
      - name: Install the fonts the recordings were measured with
        env:
          NERD_FONTS: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/JetBrainsMono.tar.xz
          NERD_FONTS_SHA256: 04d5e8f903693f9dd13e16f867e994834e681eb3c72c0d337a770dcda09010cf
          NOTO_SANS_CJK: https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/03_NotoSansCJK-OTC.zip
          NOTO_SANS_CJK_SHA256: 528f4e1b25ff3badb0321b38d015d954c4c0de926c7830ef50e4a1948f6a3eed
          NOTO_SERIF_CJK: https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/04_NotoSerifCJKOTC.zip
          NOTO_SERIF_CJK_SHA256: c76ed8fd491ce98182ec6430238b90a1eabea8857c7db64e9037efa38e198a31
        timeout-minutes: 15
        run: |
          apt=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30)
          sudo apt-get "${apt[@]}" update
          sudo apt-get "${apt[@]}" install -y --no-install-recommends \
            fontconfig fonts-liberation fonts-urw-base35 fonts-noto-core fonts-noto-color-emoji
          downloads="$HOME/font-downloads"
          mkdir -p "$downloads"
          fetch() { # url sha256 -> path of the checked download
            local file="$downloads/${1##*/}"
            # A stall cuts the transfer so --retry can start it again.
            [[ -f "$file" ]] || curl -fsSLo "$file" --retry 5 --retry-all-errors \
              --connect-timeout 30 --speed-limit 10000 --speed-time 30 "$1" || exit 1
            # exit, not return: fetch runs in $(…), where -e does not reach, and
            # a bad file must not be unpacked or cached.
            echo "$2  $file" | sha256sum -c - >&2 || { rm -f "$file"; exit 1; }
            echo "$file"
          }
          fonts="$HOME/.local/share/fonts"
          mkdir -p "$fonts/noto-cjk"
          sans_cjk=$(fetch "$NOTO_SANS_CJK" "$NOTO_SANS_CJK_SHA256")
          serif_cjk=$(fetch "$NOTO_SERIF_CJK" "$NOTO_SERIF_CJK_SHA256")
          nerd=$(fetch "$NERD_FONTS" "$NERD_FONTS_SHA256")
          unzip -qjo "$sans_cjk" '*.ttc' -d "$fonts/noto-cjk"
          unzip -qjo "$serif_cjk" '*.ttc' -d "$fonts/noto-cjk"
          tar -xJf "$nerd" -C "$fonts" \
            JetBrainsMonoNerdFont-Regular.ttf JetBrainsMonoNerdFont-Bold.ttf \
            JetBrainsMonoNerdFont-Italic.ttf JetBrainsMonoNerdFont-BoldItalic.ttf
          sudo cp .github/fontconfig/50-omarchy.conf /etc/fonts/conf.d/50-omarchy.conf
          conf="${XDG_CONFIG_HOME:-$HOME/.config}/fontconfig"
          mkdir -p "$conf"
          cp .github/fontconfig/user-fonts.conf "$conf/fonts.conf"
          fc-cache -f
          for f in sans-serif serif monospace Arial; do
            echo "$f: $(fc-match "$f" -f '%{family[0]}'); a ✓ from: $(fc-match -s "$f:charset=2713" -f '%{family[0]}, ' | head -c 120)"
          done
          fc-list -f '%{family[0]} %{style[0]} %{fontversion} %{file}\n' | grep -E 'Liberation|JetBrains|Nimbus Sans Regular|Noto Sans Regular|Noto Serif Regular' | sort
      - uses: Swatinem/rust-cache@v2.9.3
      - run: mise run setup
      # Fails if qmltestrunner, qmllint or qml6 is found but is not the pinned
      # Qt 6.11. A missing one fails the next step, through ELDUR_REQUIRE_QT.
      - run: mise run setup --check
      # Every *_e2e test of eldur_convert, and eldur_js's qml_runtime.
      - name: mise run test (the e2e tests)
        timeout-minutes: 30
        run: |
          # A test waits on qmltestrunner without a timeout; if one hangs,
          # say which page (each runs from a temp dir named after it).
          mise run test -- -p eldur_convert -p eldur_js --test '*_e2e' \
            --test qml_runtime --no-fail-fast &
          tests=$!
          for _ in $(seq 900); do kill -0 "$tests" 2>/dev/null || break; sleep 1; done
          if kill -0 "$tests" 2>/dev/null; then
            echo "::warning::the e2e tests are still running after 15 min:"
            ps -eo pid,etime,args --forest | grep -B2 -A2 '[q]mltestrunner' || true
            ls -d "${TMPDIR:-/tmp}"/eldur-* || true
          fi
          wait "$tests"
