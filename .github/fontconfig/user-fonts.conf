<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The user fonts.conf of the machine the Chromium recordings were made on (an
  Omarchy desktop, ~/.config/fontconfig/fonts.conf), for CI's qml-e2e job,
  which installs it at the same place; 50-omarchy.conf beside it is that
  machine's system config. Qt and Chromium both ask fontconfig, so the same
  rules give both the same faces.

  - The generic families are Liberation and the JetBrains Nerd Font. Without
    this, Ubuntu's Noto packages make sans-serif Noto Sans and serif Noto
    Serif, and every line of a sans-serif page is a few pixels off.
  - Added here: DejaVu is not installed there. Ubuntu's runner has it, and
    fontconfig would take a ✓ that Liberation lacks from it (DejaVu Math TeX
    Gyre first), so it is rejected by file, not family.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/dejavu/*</glob>
    </rejectfont>
  </selectfont>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="append" binding="same"><string>JetBrainsMono Nerd Font</string></edit>
  </match>
  <alias>
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>-apple-system</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias>
    <family>serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias>
    <family>monospace</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
</fontconfig>
