[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/olafura/html-2-qml"

[workspace.dependencies]
# Ours
eldur_dom = { path = "crates/eldur_dom" }
eldur_css = { path = "crates/eldur_css" }
eldur_js = { path = "crates/eldur_js" }
eldur_qml = { path = "crates/eldur_qml" }
eldur_convert = { path = "crates/eldur_convert" }
eldur_cache = { path = "crates/eldur_cache" }

# Parsers. All permissively licensed (no MPL: no servo `selectors`,
# `cssparser`, `stylo` or `lightningcss`).
html5ever = "0.40"                 # WHATWG HTML parser, MIT/Apache
# CSS Syntax 3 parser with spec error recovery and a typed selector AST,
# Apache-2.0. Chosen over raffia (MIT), which fails the whole sheet on one
# bad declaration (scratch spike, 2026-10-29).
swc_css_parser = "26"
swc_css_ast = "26"
swc_css_visit = "26"
swc_common = "26"
swc_atoms = "10"
swc_css_codegen = "26"
csscolorparser = "0.9"             # CSS Color 4 values, MIT/Apache
# Same oxc version as ~/dev/ljos-ui so the shared sccache is reused and a
# future link to ljos crates sees one oxc.
oxc_allocator = "0.144"
oxc_ast = "0.144"
oxc_ast_visit = "0.144"
oxc_codegen = "0.144"
oxc_parser = "0.144"
oxc_semantic = "0.144"
oxc_span = "0.144"
oxc_syntax = "0.144"

# Infrastructure (versions as in ljos-ui)
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# Intrinsic sizes of raster images from their headers, MIT.
imagesize = { version = "0.15", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
anyhow = "1.0"
# WHATWG URL parsing (`<base href>`), MIT/Apache.
url = "2.5"
clap = { version = "4.6", features = ["derive"] }
notify = "8.2"
insta = { version = "1.49", features = ["json"] }
indexmap = "2"
smallvec = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
